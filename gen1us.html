<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEN1US | TVT Official</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background: #fff; color: #000; }
        .logo-font { font-family: 'Anton', sans-serif; }
        .tab-btn.active { border-bottom: 3px solid #000; color: #000; font-weight: 900; }
        .member-img-box { position: relative; aspect-ratio: 1 / 1; overflow: hidden; background: #f8f8f8; }
        .member-img-box img { width: 100%; height: 100%; object-fit: cover; }
        .content-section { display: none; }
        .content-section.active { display: block; }
    </style>
</head>
<body>

    <header class="w-full border-b border-gray-100 py-6 px-10 flex justify-between items-center sticky top-0 bg-white/90 backdrop-blur-md z-50">
        <a href="index.html" class="text-3xl logo-font tracking-tighter">TVT</a>
        <div class="text-[10px] font-bold tracking-widest">MENU</div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-16">
        <div class="text-center mb-16">
            <a href="index.html" class="text-[10px] text-gray-400 uppercase tracking-[0.3em] mb-6 inline-block hover:text-black transition">← ALL ARTISTS</a>
            <h1 class="text-7xl md:text-9xl logo-font italic uppercase tracking-tighter">GEN1US</h1>
        </div>

        <div class="flex justify-center space-x-12 border-b border-gray-100 mb-16">
            <button onclick="switchTab('profile')" id="tab-profile" class="tab-btn active pb-4 text-[11px] text-gray-400 tracking-[0.2em] font-bold">PROFILE</button>
            <button onclick="switchTab('disco')" id="tab-disco" class="tab-btn pb-4 text-[11px] text-gray-400 tracking-[0.2em] font-bold">DISCOGRAPHY</button>
        </div>

        <div id="profile" class="content-section active">
            <!-- Group Banner -->
            <div class="w-full aspect-[21/9] bg-gray-50 mb-20 overflow-hidden border border-gray-100">
                <img src="images/gen1us/Masquerade-GEN1US.jpg" class="w-full h-full object-cover" onerror="this.src='https://placehold.jp/40/f8f8f8/000000/1200x500.png?text=GEN1US+IMAGE'">
            </div>

            <h2 class="text-4xl logo-font mb-12 uppercase italic tracking-tighter">Member</h2>
            
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-x-8 gap-y-16">
                <!-- Diluc -->
                <div class="group">
                    <div class="member-img-box mb-6 border border-gray-100">
                        <img src="images/gen1us/Masquerade-Diluc.jpg" onerror="this.src='https://placehold.jp/40/f0f0f0/999999/600x600.png?text=NO+IMAGE'">
                    </div>
                    <p class="logo-font text-2xl uppercase tracking-tight">Diluc</p>
                    <p class="text-[9px] text-gray-400 tracking-widest uppercase mt-1">Mondstadt / Main Vocal, Lead Dancer</p>
                </div>
                <!-- Ayato -->
                <div class="group">
                    <div class="member-img-box mb-6 border border-gray-100">
                        <img src="images/gen1us/Masquerade-Ayato.jpg" onerror="this.src='https://placehold.jp/40/f0f0f0/999999/600x600.png?text=NO+IMAGE'">
                    </div>
                    <p class="logo-font text-2xl uppercase tracking-tight">Ayato</p>
                    <p class="text-[9px] text-gray-400 tracking-widest uppercase mt-1">Inazuma / Visual, Lead Vocal</p>
                </div>
                <!-- 他のメンバーも同様に Masquerade-名前.jpg で指定 -->
                <!-- コード短縮のため省略しますが、CEO側で上記2名と同じ形式で追加可能です -->
            </div>
        </div>

        <div id="disco" class="content-section py-20 text-center">
            <h2 class="text-4xl logo-font mb-12 uppercase italic tracking-tighter text-left">Discography</h2>
            <div class="bg-gray-50 aspect-video flex items-center justify-center border border-gray-100">
                <p class="logo-font text-gray-300 text-3xl italic">Masquerade - Coming Soon</p>
            </div>
        </div>
    </main>

    <footer class="bg-white py-24 border-t border-gray-100 text-center">
        <div class="text-4xl logo-font mb-10 tracking-tighter">TVT</div>
        <p class="text-gray-400 text-[9px] tracking-[0.3em] uppercase leading-loose">
            &copy; Teyvat Entertainment All Rights Reserved.
        </p>
    </footer>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.content-section').forEach(section => section.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
        }
    </script>
</body>
</html>
