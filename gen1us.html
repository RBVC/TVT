<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEN1US | TVT Official</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #fff; color: #000; font-family: 'Noto Sans JP', sans-serif; }
        .logo-font { font-family: 'Anton', sans-serif; }
        .tab-btn.active { border-bottom: 2px solid #000; color: #000; font-weight: 900; }
        .member-img-box { position: relative; aspect-ratio: 1 / 1; overflow: hidden; background: #f9f9f9; border: 1px solid #f0f0f0; }
        .member-img-box img { width: 100%; height: 100%; object-fit: cover; }
        .content-section { display: none; }
        .content-section.active { display: block; }
    </style>
</head>
<body>
    <header class="w-full border-b border-gray-100 py-6 px-10 flex justify-between items-center bg-white sticky top-0 z-50">
        <a href="index.html" class="text-3xl logo-font tracking-tighter">TVT</a>
        <div class="text-[10px] font-bold text-gray-400">JP</div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-10">
        <div class="text-center mb-10">
            <a href="index.html" class="text-[10px] text-gray-400 uppercase tracking-[0.3em] mb-4 inline-block hover:text-black transition">← ALL ARTISTS</a>
            <h1 class="text-7xl md:text-9xl logo-font italic uppercase tracking-tighter">GEN1US</h1>
        </div>

        <div class="flex justify-center space-x-12 border-b border-gray-100 mb-16">
            <button onclick="switchTab('profile')" id="tab-profile" class="tab-btn active pb-4 text-xs text-gray-400 tracking-widest">PROFILE</button>
            <button onclick="switchTab('disco')" id="tab-disco" class="tab-btn pb-4 text-xs text-gray-400 tracking-widest">DISCOGRAPHY</button>
        </div>

        <div id="profile" class="content-section active">
            <div class="w-full aspect-[21/9] bg-gray-50 mb-20 overflow-hidden border border-gray-100 shadow-sm">
                <img src="images/gen1us/masquerade-gen1us.jpg" class="w-full h-full object-cover" onerror="this.src='https://placehold.jp/40/f9f9f9/000000/1200x500.png?text=GEN1US+IMAGE'">
            </div>
            <h2 class="text-4xl logo-font mb-12 uppercase italic tracking-tighter">Member</h2>
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
                <!-- Diluc -->
                <div>
                    <div class="member-img-box mb-4">
                        <img src="images/gen1us/masquerade-diluc.jpg" onerror="this.style.display='none'">
                    </div>
                    <p class="logo-font text-2xl uppercase tracking-tighter">Diluc</p>
                    <p class="text-[9px] text-gray-400 tracking-widest mt-1">Mondstadt / Main Vocal, Lead Dancer</p>
                </div>
                <!-- Ayato -->
                <div>
                    <div class="member-img-box mb-4">
                        <img src="images/gen1us/masquerade-ayato.jpg" onerror="this.style.display='none'">
                    </div>
                    <p class="logo-font text-2xl uppercase tracking-tighter">Ayato</p>
                    <p class="text-[9px] text-gray-400 tracking-widest mt-1">Inazuma / Visual, Lead Vocal</p>
                </div>
                <!-- 他のメンバーも同様に追加可能 -->
            </div>
        </div>

        <div id="disco" class="content-section py-20 text-center">
            <p class="logo-font text-gray-200 text-3xl italic">DISCOGRAPHY COMING SOON</p>
        </div>
    </main>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.content-section').forEach(section => section.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
        }
    </script>
</body>
</html>
