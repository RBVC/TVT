<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEN1US | TVT Official</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@300;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #fff; color: #000; font-family: 'Noto Sans JP', sans-serif; -webkit-font-smoothing: antialiased; }
        .logo-font { font-family: 'Anton', sans-serif; letter-spacing: 0.05em; }
        
        /* 見出しの字間を広げて優雅に */
        .section-title { font-family: 'Anton', sans-serif; letter-spacing: 0.2em; text-transform: uppercase; font-style: italic; }
        
        /* メンバー名の字間調整 */
        .member-name { font-family: 'Anton', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; font-size: 1.75rem; }
        
        .tab-btn { transition: 0.3s; letter-spacing: 0.2em; }
        .tab-btn.active { border-bottom: 2px solid #000; color: #000; font-weight: 900; }
        
        .member-img-box { position: relative; aspect-ratio: 1 / 1; overflow: hidden; background: #fcfcfc; border: 1px solid #f0f0f0; }
        .member-img-box img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(10%); transition: 0.5s; }
        .member-card:hover img { filter: grayscale(0%); transform: scale(1.03); }
        
        .content-section { display: none; }
        .content-section.active { display: block; }
    </style>
</head>
<body>
    <header class="w-full border-b border-gray-100 py-6 px-10 flex justify-between items-center bg-white/90 backdrop-blur-md sticky top-0 z-50">
        <a href="index.html" class="text-3xl logo-font tracking-tighter">TVT</a>
        <div class="text-[10px] font-bold text-gray-400 tracking-[0.3em]">JP / EN</div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-16">
        <!-- Title Area -->
        <div class="text-center mb-20">
            <a href="index.html" class="text-[10px] text-gray-300 uppercase tracking-[0.4em] mb-6 inline-block hover:text-black transition">← BACK TO LIST</a>
            <h1 class="text-7xl md:text-9xl section-title">GEN1US</h1>
        </div>

        <!-- Tabs -->
        <div class="flex justify-center space-x-16 border-b border-gray-100 mb-20">
            <button onclick="switchTab('profile')" id="tab-profile" class="tab-btn active pb-6 text-[11px] text-gray-400 font-bold uppercase">Profile</button>
            <button onclick="switchTab('disco')" id="tab-disco" class="tab-btn pb-6 text-[11px] text-gray-400 font-bold uppercase">Discography</button>
        </div>

        <!-- PROFILE -->
        <div id="profile" class="content-section active">
            <!-- Group Banner -->
            <div class="w-full aspect-[21/9] bg-gray-50 mb-24 overflow-hidden border border-gray-100">
                <img src="images/gen1us/masquerade-gen1us.jpg" class="w-full h-full object-cover">
            </div>

            <!-- Heading -->
            <div class="mb-16 border-b-2 border-black pb-4 inline-block">
                <h2 class="text-4xl section-title">Member</h2>
            </div>
            
            <!-- Member Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-12 gap-y-24">
                
                <!-- Diluc -->
                <div class="member-card">
                    <div class="member-img-box mb-8">
                        <img src="images/gen1us/masquerade-diluc.jpg">
                    </div>
                    <p class="member-name">Diluc</p>
                    <p class="text-[11px] text-gray-500 tracking-[0.15em] uppercase mt-2 font-bold">Mondstadt</p>
                    <p class="text-[10px] text-gray-400 tracking-[0.1em] uppercase mt-1">Main Vocal / Lead Dancer</p>
                </div>

                <!-- Ayato -->
                <div class="member-card">
                    <div class="member-img-box mb-8">
                        <img src="images/gen1us/masquerade-ayato.jpg">
                    </div>
                    <p class="member-name">Ayato</p>
                    <p class="text-[11px] text-gray-500 tracking-[0.15em] uppercase mt-2 font-bold">Inazuma</p>
                    <p class="text-[10px] text-gray-400 tracking-[0.1em] uppercase mt-1">Visual / Lead Vocal</p>
                </div>

                <!-- 追加メンバーも同じ構造でここに... -->

            </div>
        </div>

        <div id="disco" class="content-section py-32 text-center">
            <p class="section-title text-gray-200 text-4xl italic">Discography Coming Soon</p>
        </div>
    </main>

    <footer class="py-24 border-t border-gray-50 text-center">
        <div class="text-5xl logo-font mb-10 tracking-tighter">TVT</div>
        <p class="text-gray-300 text-[9px] tracking-[0.4em] uppercase">
            &copy; Teyvat Entertainment All Rights Reserved.
        </p>
    </footer>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.content-section').forEach(section => section.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
        }
    </script>
</body>
</html>
