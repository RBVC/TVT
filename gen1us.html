<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEN1US | TVT Official</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #fff; color: #000; font-family: 'Noto Sans JP', sans-serif; }
        .logo-font { font-family: 'Anton', sans-serif; }
        .section-title { font-family: 'Anton', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; font-style: italic; }
        .member-name { font-family: 'Anton', sans-serif; letter-spacing: 0.05em; text-transform: uppercase; font-size: 2rem; line-height: 1; }
        .tab-btn { transition: 0.3s; letter-spacing: 0.15em; font-size: 0.7rem; font-weight: 700; }
        .tab-btn.active { border-bottom: 2px solid #000; color: #000; }
        .member-img-box { position: relative; aspect-ratio: 1 / 1; overflow: hidden; background: #f9f9f9; border: 1px solid #f0f0f0; }
        .member-img-box img { width: 100%; height: 100%; object-fit: cover; }
        .content-section { display: none; }
        .content-section.active { display: block; }
    </style>
</head>
<body>
    <header class="w-full border-b border-gray-100 py-6 px-10 flex justify-between items-center bg-white sticky top-0 z-50">
        <a href="index.html" class="text-3xl logo-font tracking-tighter">TVT</a>
        <div class="text-[10px] font-bold text-gray-400 tracking-widest">JP</div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-10">
        <div class="text-center mb-16">
            <a href="index.html" class="text-[10px] text-gray-400 uppercase tracking-widest mb-4 inline-block hover:text-black transition">← ALL ARTISTS</a>
            <h1 class="text-7xl md:text-9xl section-title text-black">GEN1US</h1>
        </div>

        <div class="flex justify-center space-x-12 border-b border-gray-100 mb-20">
            <button onclick="switchTab('profile')" id="tab-profile" class="tab-btn active pb-4 text-gray-400 uppercase">Profile</button>
            <button onclick="switchTab('disco')" id="tab-disco" class="tab-btn pb-4 text-gray-400 uppercase">Discography</button>
        </div>

        <div id="profile" class="content-section active">
            <div class="w-full aspect-[21/9] bg-gray-50 mb-20 overflow-hidden border border-gray-100">
                <img src="images/gen1us/masquerade-gen1us.jpg" class="w-full h-full object-cover">
            </div>

            <h2 class="text-4xl section-title mb-16 border-l-8 border-black pl-6">Member</h2>
            
            <div class="grid grid-cols-2 lg:grid-cols-3 gap-x-10 gap-y-20">
                <!-- Diluc -->
                <div class="member-card">
                    <div class="member-img-box mb-6">
                        <img src="images/gen1us/masquerade-diluc.jpg">
                    </div>
                    <p class="member-name">Diluc</p>
                    <p class="text-[11px] text-gray-400 tracking-wider mt-2 uppercase font-bold">Mondstadt</p>
                    <p class="text-[10px] text-gray-400 tracking-wider uppercase">Main Vocal / Lead Dancer</p>
                </div>

                <!-- Ayato -->
                <div class="member-card">
                    <div class="member-img-box mb-6">
                        <img src="images/gen1us/masquerade-ayato.jpg">
                    </div>
                    <p class="member-name">Ayato</p>
                    <p class="text-[11px] text-gray-500 tracking-wider mt-2 uppercase font-bold">Inazuma</p>
                    <p class="text-[10px] text-gray-400 tracking-wider uppercase">Visual / Lead Vocal</p>
                </div>

                <!-- 💡他のメンバーも同じ形式で、 src="images/gen1us/masquerade-名前.jpg" で追加していけます -->
            </div>
        </div>

        <div id="disco" class="content-section py-32 text-center">
            <p class="section-title text-gray-200 text-5xl">Coming Soon</p>
        </div>
    </main>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.content-section').forEach(section => section.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
        }
    </script>
</body>
</html>
