name: AI Studio Automatic Developer

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: 'AI Studio本部からの指示'
        required: true
        default: '全体のバグをチェックして、デザインをより良く修正して'

jobs:
  update-code:
    runs-on: ubuntu-latest
    steps:
      - name: クローニング（最新ファイルの取得）
        uses: actions/checkout@v4

      - name: Gemini APIにおまかせ修正を依頼
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 -c "
          import os, urllib.request, json, glob
          
          # ディレクトリ内の主要なWEBファイルを自動的にすべて探索して読み込む
          target_extensions = ['*.html', '*.css', '*.js']
          files_dict = {}
          
          for ext in target_extensions:
              for file_path in glob.glob(ext):
                  files_dict[file_path] = open(file_path, 'r', encoding='utf-8').read()
          
          # 読み込んだファイルの情報をプロンプト用にまとめる
          files_context = ''
          for name, content in files_dict.items():
              files_context += f'\n【{name}】\n{content}\n'
          
          user_instruction = \"${{ github.event.inputs.instruction }}\"
          
          prompt = f'''
          あなたは凄腕のフロントエンドエンジニア兼WEBデザイナーです。
          現在のホームページのすべてのファイル構成は以下の通りです。

          {files_context}

          主人からの指示：{user_instruction}

          この指示に従って、必要に応じてファイルを修正・連携させてアップデートしてください。
          出力は必ず以下のJSON形式のみで返してください。余計な挨拶や解説、マークダウンの\`\`\`jsonなどの枠は一切不要です。既存のファイルにないものでも、指示に必要なファイルであれば自由に追加して構いません。
          {{
            \"ファイル名1.html\": \"修正後の全内容\",
            \"ファイル名2.css\": \"修正後の全内容\"
          }}
          '''
          
          url = 'https://generativelending.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + os.environ['GEMINI_API_KEY']
          data = json.dumps({'contents': [{'parts': [{'text': prompt}]}]}).encode('utf-8')
          req = urllib.request.Request(url, data=data, headers={'Content-Type': 'application/json'})
          
          try:
              response = urllib.request.urlopen(req)
              res_json = json.loads(response.read().decode('utf-8'))
              ai_text = res_json['candidates'][0]['content']['parts'][0]['text']
              
              # AIの返答からJSONをクリーンアップ
              clean_text = ai_text.strip().replace('```json', '').replace('```', '').strip()
              result = json.loads(clean_text)
              
              # 生成されたファイル群を自動上書き保存
              for filename, code in result.items():
                  with open(filename, 'w', encoding='utf-8') as f:
                      f.write(code)
              print('AIによる修正と全ファイルの自動書き換えが完了しました。')
          except Exception as e:
              print(f'エラーが発生しました: {e}')
              if 'ai_text' in locals(): print(f'AIの生の返答: {ai_text}')
              exit(1)
          "

      - name: 変更を保存してGitHubに反映
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "AIによる自動修正: ${{ github.event.inputs.instruction }}" || exit 0
          git push
