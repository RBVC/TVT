name: TVT-AI-Automatic-Developer-v6

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: 'CCOへの指示を入力'
        required: true
        default: '全体のデザインをチェックして、さらに洗練させて'

jobs:
  update-code:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Gemini AI Update (Robust Version)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          USER_INPUT: ${{ github.event.inputs.instruction }}
        run: |
          python3 -c "
          import os, urllib.request, urllib.error, json, glob, re, sys

          def call_gemini(api_key, model, prompt):
              url = f'https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={api_key}'
              payload = {'contents': [{'parts': [{'text': prompt}]}]}
              print(f'📡 {model} にリクエスト送信中...')
              req = urllib.request.Request(url, data=json.dumps(payload).encode('utf-8'), headers={'Content-Type': 'application/json'})
              with urllib.request.urlopen(req) as res:
                  return json.loads(res.read().decode('utf-8'))

          def solve():
              print('🚀 TVT自動開発システム v6 起動...')
              api_key = os.environ.get('GEMINI_API_KEY')
              if not api_key:
                  print('❌ Secrets設定ミス: GEMINI_API_KEY が見つかりません。')
                  sys.exit(1)

              # 1. ファイルスキャン
              files_dict = {}
              for ext in ['*.html', '*.css', '*.js']:
                  for path in glob.glob(ext):
                      with open(path, 'r', encoding='utf-8') as f:
                          files_dict[path] = f.read()
              
              context = '\n'.join([f'【{n}】\n{c}' for n, c in files_dict.items()])
              instruction = os.environ.get('USER_INPUT', '')
              prompt = f'''あなたは世界最高のWEBエンジニアです。
              
              現在の全ソースコード：
              {context}

              主人からの指示：{instruction}

              【返答の鉄則：厳守】
              - 会話、解説、装飾（\`\`\`jsonなど）は一切不要。
              - 全ての修正ファイルを、以下の純粋なJSON形式1つにまとめて返せ。
              {{
                \"filename.html\": \"full code...\"
              }}
              '''

              # 2. トリプル・フォールバック (1.5 Flash Latest -> 1.5 Flash -> 1.0 Pro)
              models_to_try = ['gemini-1.5-flash-latest', 'gemini-1.5-flash', 'gemini-pro']
              ai_text = None
              
              for model in models_to_try:
                  try:
                      res_json = call_gemini(api_key, model, prompt)
                      ai_text = res_json['candidates'][0]['content']['parts'][0]['text']
                      print(f'✅ {model} からの応答を受信しました。')
                      break
                  except urllib.error.HTTPError as e:
                      print(f'⚠️ {model} が利用不可 (Error {e.code})。次のモデルを試します...')
                      continue
                  except Exception as e:
                      print(f'⚠️ {model} で予期せぬエラー: {e}')
                      continue

              if not ai_text:
                  print('❌ 全てのモデルで接続に失敗しました。APIキーまたはリージョン制限を確認してください。')
                  sys.exit(1)

              # 3. JSON抽出と書き換え
              try:
                  match = re.search(r'(\{.*\})', ai_text, re.DOTALL)
                  if match:
                      result = json.loads(match.group(1))
                      for filename, code in result.items():
                          with open(filename, 'w', encoding='utf-8') as f:
                              f.write(code)
                      print(f'🎉 完遂: {list(result.keys())} を更新しました。')
                  else:
                      print('❌ エラー: AIの返答がJSON形式ではありません。')
                      print(f'AI返答原文:\n{ai_text}')
                      sys.exit(1)
              except Exception as e:
                  print(f'❌ 処理エラー: {e}')
                  sys.exit(1)

          solve()
          "

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "TVT-AI-Bot"
          git add -A
          git commit -m "AI Update: ${{ github.event.inputs.instruction }}" || exit 0
          git push
