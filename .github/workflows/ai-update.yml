name: TVT-AI-Automatic-Developer

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: 'CCOへの指示（例：6reezeのメンバーを追加して、デザインを整えて）'
        required: true
        default: '全体のバグをチェックして、デザインをより良く修正して'

jobs:
  update-code:
    runs-on: ubuntu-latest
    steps:
      - name: クローニング（最新ファイルの取得）
        uses: actions/checkout@v4

      - name: Gemini APIにおまかせ修正を依頼
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 -c "
          import os, urllib.request, json, glob
          
          # 1. ファイルの探索
          target_extensions = ['*.html', '*.css', '*.js']
          files_dict = {}
          for ext in target_extensions:
              for file_path in glob.glob(ext):
                  files_dict[file_path] = open(file_path, 'r', encoding='utf-8').read()
          
          files_context = ''
          for name, content in files_dict.items():
              files_context += f'\n【{name}】\n{content}\n'
          
          # 2. プロンプトの作成
          user_instruction = \"${{ github.event.inputs.instruction }}\"
          prompt = f'''
          あなたは最強のフロントエンドエンジニアです。
          現在のファイル構成：
          {files_context}

          主人からの指示：{user_instruction}

          【ルール】
          1. 指示に従い、ファイルを修正または新規作成してください。
          2. 出力は必ず以下の純粋なJSON形式のみで返してください。
          3. 解説や装飾文字（\`\`\`jsonなど）は一切不要です。
          {{
            \"filename.html\": \"full content\",
            \"style.css\": \"full content\"
          }}
          '''
          
          # 3. APIリクエスト（モデルを1.5-flashに修正、URLも修正）
          url = f'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={os.environ[\"GEMINI_API_KEY\"]}'
          data = json.dumps({'contents': [{'parts': [{'text': prompt}]}]}).encode('utf-8')
          req = urllib.request.Request(url, data=data, headers={'Content-Type': 'application/json'})
          
          try:
              response = urllib.request.urlopen(req)
              res_json = json.loads(response.read().decode('utf-8'))
              ai_text = res_json['candidates'][0]['content']['parts'][0]['text']
              
              # 余計な装飾を削ってJSONとして読み込む
              clean_text = ai_text.strip().replace('```json', '').replace('```', '').strip()
              result = json.loads(clean_text)
              
              for filename, code in result.items():
                  with open(filename, 'w', encoding='utf-8') as f:
                      f.write(code)
              print('Success: AI has updated the files.')
          except Exception as e:
              print(f'Error: {e}')
              exit(1)
          "

      - name: 変更を保存してGitHubに反映
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "TVT-AI-Bot"
          git add -A
          git commit -m "AIによる自動修正: ${{ github.event.inputs.instruction }}" || exit 0
          git push
