name: AI Studio Developer Assistant

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: 'AI Studio本部からの指示（例：ボタンをフワッと動かして、背景をグラデーションにして）'
        required: true
        default: '全体のデザインを今風に少し整えて'

jobs:
  update-code:
    runs-on: ubuntu-latest
    steps:
      - name: クローニング（最新ファイルの取得）
        uses: actions/checkout@v4

      - name: Gemini APIに修正を依頼
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 -c "
          import os, urllib.request, json
          
          # あなたのサイトの主要な3つのファイルを読み込みます（なければ新規作成）
          html_content = open('index.html', 'r').read() if os.path.exists('index.html') else '<!-- 新規作成 -->'
          css_content = open('style.css', 'r').read() if os.path.exists('style.css') else '/* 新規作成 */'
          js_content = open('main.js', 'r').read() if os.path.exists('main.js') else '// 新規作成（もしscript.jsなら後で名前を変更できます）'
          
          prompt = f'''
          あなたは凄腕のフロントエンドエンジニア兼WEBデザイナーです。
          現在のホームページのファイル構成は以下の通りです。

          【index.html】
          {html_content}

          【style.css】
          {css_content}

          【main.js】
          {js_content}

          主人からの指示：${{ {{ github.event.inputs.instruction }} }}

          この指示に従って、HTML、CSS、JavaScriptを修正・連携させてアップデートしてください。
          出力は必ず以下のJSON形式のみで返してください。余計な挨拶や解説、マークダウンの\`\`\`jsonなどの枠は一切不要です。
          {{
            \"index.html\": \"修正後のHTMLの全内容\",
            \"style.css\": \"修正後のCSSの全内容\",
            \"main.js\": \"修正後のJavaScriptの全内容\"
          }}
          '''
          
          url = 'https://generativelending.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + os.environ['GEMINI_API_KEY']
          data = json.dumps({\"contents\": [{{'parts': [{{'text': prompt}}]}}]}).encode('utf-8')
          req = urllib.request.Request(url, data=data, headers={'Content-Type': 'application/json'})
          
          try:
              response = urllib.request.urlopen(req)
              res_json = json.loads(response.read().decode('utf-8'))
              ai_text = res_json['candidates'][0]['content']['parts'][0]['text']
              
              # 余計な装飾を削る
              clean_text = ai_text.strip().replace('```json', '').replace('
```', '').strip()
              result = json.loads(clean_text)
              
              with open('index.html', 'w') as f: f.write(result['index.html'])
              with open('style.css', 'w') as f: f.write(result['style.css'])
              with open('main.js', 'w') as f: f.write(result['main.js'])
              print('AIによる修正が完了しました。')
          except Exception as e:
              print(f'エラーが発生しました: {e}')
              if 'ai_text' in locals(): print(f'AIの返答: {ai_text}')
              exit(1)
          "

      - name: 変更を保存してGitHubに反映
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "AIによる自動修正: ${{ github.event.inputs.instruction }}" || exit 0
          git push
