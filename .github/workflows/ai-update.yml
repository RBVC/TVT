name: TVT-AI-Automatic-Developer-v2

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: '指示内容を入力'
        required: true
        default: 'デザインを少し洗練させて'

jobs:
  update-code:
    runs-on: ubuntu-latest
    permissions: # 明示的に書き込み権限を付与
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Gemini AI Update
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          USER_INPUT: ${{ github.event.inputs.instruction }}
        run: |
          python3 -c "
          import os, urllib.request, json, glob, re

          def solve():
              # 1. ファイル読み込み
              files_dict = {}
              for ext in ['*.html', '*.css', '*.js']:
                  for path in glob.glob(ext):
                      with open(path, 'r', encoding='utf-8') as f:
                          files_dict[path] = f.read()
              
              context = '\n'.join([f'【{n}】\n{c}' for n, c in files_dict.items()])
              instruction = os.environ.get('USER_INPUT', '')

              # 2. プロンプト作成
              prompt = f'''あなたは天才WEBエンジニアです。
              現在のコード：
              {context}

              指示：{instruction}

              【重要】
              返答は必ず以下のJSON形式のみとし、\`\`\`json などのマークダウンや解説は一切含めないでください。
              {{
                \"filename\": \"content\"
              }}
              '''

              # 3. APIリクエスト
              url = f'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={os.environ[\"GEMINI_API_KEY\"]}'
              payload = {'contents': [{'parts': [{'text': prompt}]}]}
              
              try:
                  req = urllib.request.Request(url, data=json.dumps(payload).encode('utf-8'), headers={'Content-Type': 'application/json'})
                  with urllib.request.urlopen(req) as res:
                      res_json = json.loads(res.read().decode('utf-8'))
                      ai_text = res_json['candidates'][0]['content']['parts'][0]['text']
                      
                      # JSON部分だけを抽出する（余計な文字が入った場合対策）
                      match = re.search(r'\{.*\}', ai_text, re.DOTALL)
                      if match:
                          clean_json = match.group(0)
                          result = json.loads(clean_json)
                          for filename, code in result.items():
                              with open(filename, 'w', encoding='utf-8') as f:
                                  f.write(code)
                          print('AI Update Success.')
                      else:
                          print('Error: AI response was not JSON.')
                          print(f'AI Response: {ai_text}')
                          exit(1)
              except Exception as e:
                  print(f'Critical Error: {e}')
                  exit(1)

          solve()
          "

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "TVT-AI-Bot"
          git add -A
          git commit -m "AI Update: ${{ github.event.inputs.instruction }}" || exit 0
          git push
