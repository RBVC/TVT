name: AI Studio Automatic Developer

on:
  workflow_dispatch: # 文字入力欄を完全に無くしました！ボタンを押すだけで動きます。

jobs:
  update-code:
    runs-on: ubuntu-latest
    steps:
      - name: クローニング（最新ファイルの取得）
        uses: actions/checkout@v4

      - name: Gemini APIにお任せ修正を依頼
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 -c "
          import os, urllib.request, json
          
          # あなたのサイトの主要なファイルをすべて読み込みます
          html_content = open('index.html', 'r').read() if os.path.exists('index.html') else ''
          artist_html = open('artist.html', 'r').read() if os.path.exists('artist.html') else ''
          wiki_html = open('wiki.html', 'r').read() if os.path.exists('wiki.html') else ''
          css_content = open('style.css', 'r').read() if os.path.exists('style.css') else '/* 新規作成 */'
          js_content = open('group.js', 'r').read() if os.path.exists('group.js') else '// 新規作成'
          
          prompt = f'''
          あなたは世界最高峰のWEBデザイナー兼フロントエンドエンジニアです。
          現在主人が開発中のホームページ（TVT）のファイル一式は以下の通りです。

          【index.html】
          {html_content}

          【artist.html】
          {artist_html}

          【wiki.html】
          {wiki_html}

          【style.css】
          {css_content}

          【group.js】
          {js_content}

          【あなたの仕事】
          これらのファイル全体をプロの目で見直してください。
          AI Studio本部でのこれまでの開発の流れ（TVTというサイトの文脈）を汲み取り、
          「デザインの洗練（今風でおしゃれに）」「バグの修正」「レスポンシブ（スマホ対応）の強化」「JSの動きの改善」など、
          現状のクオリティをより一段高めるための最適なアップデートを、あなたの判断で**すべてのファイルに**施してください。

          出力は必ず以下のJSON形式のみで返してください。余計な挨拶や解説、マークダウンの枠は一切不要です。
          {{
            \"index.html\": \"修正後の内容\",
            \"artist.html\": \"修正後の内容\",
            \"wiki.html\": \"修正後の内容\",
            \"style.css\": \"修正後の内容\",
            \"group.js\": \"修正後の内容\"
          }}
          '''
          
          url = 'https://generativelending.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + os.environ['GEMINI_API_KEY']
          data = json.dumps({\"contents\": [{{'parts': [{{'text': prompt}}]}}]}).encode('utf-8')
          req = urllib.request.Request(url, data=data, headers={'Content-Type': 'application/json'})
          
          try:
              response = urllib.request.urlopen(req)
              res_json = json.loads(response.read().decode('utf-8'))
              ai_text = res_json['candidates'][0]['content']['parts'][0]['text']
              
              clean_text = ai_text.strip().replace('```json', '').replace('```', '').strip()
              result = json.loads(clean_text)
              
              with open('index.html', 'w') as f: f.write(result['index.html'])
              with open('artist.html', 'w') as f: f.write(result['artist.html'])
              with open('wiki.html', 'w') as f: f.write(result['wiki.html'])
              with open('style.css', 'w') as f: f.write(result['style.css'])
              with open('group.js', 'w') as f: f.write(result['group.js'])
              print('AIによる自動ブラッシュアップが完了しました。')
          except Exception as e:
              print(f'エラーが発生しました: {e}')
              if 'ai_text' in locals(): print(f'AIの返答: {ai_text}')
              exit(1)
          "

      - name: 変更を保存してGitHubに反映
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "AIによる自動ブラッシュアップ（お任せ実行）" || exit 0
          git push
