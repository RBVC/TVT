name: TVT-AI-Automatic-Developer-v4

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: 'CCOへの指示を入力'
        required: true
        default: '全体のデザインをチェックして、さらに洗練させて'

jobs:
  update-code:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # GitHubの警告（Node.js 20の件）を解消するための設定
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Gemini AI Update
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          USER_INPUT: ${{ github.event.inputs.instruction }}
        run: |
          python3 -c "
          import os, urllib.request, urllib.error, json, glob, re, sys

          def solve():
              print('🚀 診断開始...')
              api_key = os.environ.get('GEMINI_API_KEY')
              if not api_key:
                  print('❌ 致命的エラー: Secretsに GEMINI_API_KEY が登録されていません。')
                  sys.exit(1)

              # 1. ファイル読み込み（テキストファイルのみ）
              files_dict = {}
              print('📁 ファイルをスキャン中...')
              for ext in ['*.html', '*.css', '*.js']:
                  for path in glob.glob(ext):
                      try:
                          with open(path, 'r', encoding='utf-8') as f:
                              files_dict[path] = f.read()
                          print(f'  - {path} を読み込みました')
                      except Exception as e:
                          print(f'  - ⚠️ {path} の読み込みに失敗: {e}')
              
              if not files_dict:
                  print('❌ エラー: 対象ファイル（html/css/js）が見つかりません。')
                  sys.exit(1)

              context = '\n'.join([f'【{n}】\n{c}' for n, c in files_dict.items()])
              instruction = os.environ.get('USER_INPUT', '')

              # 2. プロンプト作成
              prompt = f'''あなたは世界最高峰のフロントエンドエンジニアです。
              
              現在のコード：
              {context}

              主人からの指示：{instruction}

              【返答の鉄則】
              - 会話や解説、\`\`\`json などの装飾は一切不要。
              - 修正後のファイル名とコード全文を、以下の純粋なJSON形式のみで出力せよ。
              {{
                \"filename\": \"修正後の全コード\"
              }}
              '''

              # 3. APIリクエスト
              url = f'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={api_key}'
              payload = {'contents': [{'parts': [{'text': prompt}]}]}
              
              print('📡 Gemini APIにリクエストを送信しています...')
              try:
                  req = urllib.request.Request(url, data=json.dumps(payload).encode('utf-8'), headers={'Content-Type': 'application/json'})
                  with urllib.request.urlopen(req) as res:
                      res_json = json.loads(res.read().decode('utf-8'))
                      ai_text = res_json['candidates'][0]['content']['parts'][0]['text']
                      
                      # JSON抽出
                      match = re.search(r'\{.*\}', ai_text, re.DOTALL)
                      if match:
                          result = json.loads(match.group(0))
                          for filename, code in result.items():
                              with open(filename, 'w', encoding='utf-8') as f:
                                  f.write(code)
                          print(f'✅ 成功: {list(result.keys())} をアップデートしました。')
                      else:
                          print('❌ エラー: AIの返答がJSONではありませんでした。')
                          print(f'AIの返答原文:\n{ai_text}')
                          sys.exit(1)
              except urllib.error.HTTPError as e:
                  print(f'❌ API通信エラー: {e.code} {e.reason}')
                  print(e.read().decode('utf-8'))
                  sys.exit(1)
              except Exception as e:
                  print(f'❌ 予期せぬエラー: {e}')
                  sys.exit(1)

          solve()
          "

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "TVT-AI-Bot"
          git add -A
          git commit -m "AI Update: ${{ github.event.inputs.instruction }}" || exit 0
          git push
