<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARTIST | TVT OFFICIAL</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="group.js"></script>
</head>
<body>
    <header>
        <a href="index.html" class="logo logo-font">TVT</a>
        <nav>
            <a href="index.html#artists">ARTISTS</a>
            <a href="wiki.html">WIKI</a>
        </nav>
        <div class="text-[10px] font-bold text-gray-400 uppercase">JP</div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-24">
        <!-- Breadcrumb & Title -->
        <div class="text-center mb-16 pt-10">
            <a href="index.html#artists" class="text-[10px] text-gray-300 uppercase tracking-[0.4em] mb-6 inline-block hover:text-black transition font-bold">← ALL ARTISTS</a>
            <h1 id="group-name" class="text-7xl md:text-9xl logo-font tracking-tighter">ARTIST</h1>
        </div>

        <!-- Tabs -->
        <div class="flex justify-center space-x-12 mb-16 border-b border-gray-100">
            <button onclick="switchTab('profile')" id="btn-profile" class="tab-btn active uppercase">PROFILE</button>
            <button onclick="switchTab('disco')" id="btn-disco" class="tab-btn uppercase">DISCOGRAPHY</button>
        </div>

        <!-- PROFILE CONTENT -->
        <div id="profile" class="content-section block">
            <div class="w-full aspect-[21/9] bg-gray-50 mb-20 overflow-hidden border border-gray-100 shadow-sm">
                <img id="group-banner" src="" class="w-full h-full object-cover">
            </div>
            <h2 class="text-4xl logo-font mb-12 border-l-8 border-black pl-6">MEMBER</h2>
            <div id="member-grid" class="grid grid-cols-2 lg:grid-cols-3 gap-x-10 gap-y-20"></div>
        </div>

        <!-- DISCOGRAPHY CONTENT -->
        <div id="disco" class="content-section hidden">
            <h2 class="text-4xl logo-font mb-12 border-l-8 border-black pl-6">DISCOGRAPHY</h2>
            <div id="disco-list" class="grid grid-cols-1 gap-10 text-center"></div>
        </div>
    </main>

    <footer>
        <div class="f-logo logo-font">TVT</div>
        <p>&copy; Teyvat Entertainment All Rights Reserved.</p>
    </footer>

    <script>
        const params = new URLSearchParams(window.location.search);
        const groupId = params.get('id') || 'gen1us';
        const data = allGroups[groupId];

        if (data) {
            document.title = `${data.name} | TVT OFFICIAL`;
            document.getElementById('group-name').innerText = data.name;
            document.getElementById('group-concept').innerText = data.concept;
            document.getElementById('group-banner').src = data.banner;

            const memberGrid = document.getElementById('member-grid');
            data.members.forEach(m => {
                memberGrid.innerHTML += `
                    <div class="member-card">
                        <div class="aspect-square overflow-hidden bg-gray-50 border border-gray-100 mb-6">
                            <img src="${m.img}" class="w-full h-full object-cover" onerror="this.src='https://placehold.jp/400x400.png?text=NO+IMAGE'">
                        </div>
                        <p class="logo-font text-2xl tracking-wider">${m.name}</p>
                        <p class="text-[12px] text-black font-black mt-3 uppercase tracking-widest">${m.div}</p>
                        <p class="text-[10px] text-gray-400 mt-1 uppercase tracking-widest leading-relaxed">${m.pos}</p>
                    </div>
                `;
            });

            const discoList = document.getElementById('disco-list');
            if (data.discography.length === 0) {
                discoList.innerHTML = '<p class="logo-font text-gray-200 text-3xl uppercase">COMING SOON</p>';
            } else {
                data.discography.forEach(d => {
                    discoList.innerHTML += `
                        <div class="bg-gray-50 p-10 border border-gray-100 text-left">
                            <p class="text-[9px] text-gray-400 uppercase tracking-widest mb-2">${d.type} / ${d.date}</p>
                            <h3 class="text-2xl logo-font mb-6 uppercase">${d.title}</h3>
                            <div class="aspect-video bg-black flex items-center justify-center text-white text-xs uppercase font-bold italic">Music Video Area</div>
                        </div>
                    `;
                });
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.content-section').forEach(s => { s.classList.add('hidden'); s.classList.remove('block'); });
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabName).classList.remove('hidden');
            document.getElementById(tabName).classList.add('block');
            document.getElementById('btn-' + tabName).classList.add('active');
        }
    </script>
</body>
</html>
