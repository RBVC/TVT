<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist | TVT Official</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="group.js"></script>
</head>
<body>
    <header>
        <a href="index.html" class="logo logo-font">TVT</a>
        <nav>
            <a href="index.html" class="active">Artists</a>
            <a href="wiki.html">Wiki</a>
        </nav>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-24">
        <div class="text-center mb-16">
            <p id="group-concept" class="text-[10px] text-gray-300 tracking-[0.4em] mb-4 uppercase italic"></p>
            <h1 id="group-name" class="text-7xl md:text-9xl logo-font italic uppercase tracking-tighter">Artist</h1>
        </div>

        <div class="flex justify-center space-x-12 border-b border-gray-100 mb-16">
            <button onclick="switchTab('profile')" id="tab-profile" class="tab-btn active pb-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest">Profile</button>
            <button onclick="switchTab('disco')" id="tab-disco" class="tab-btn pb-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest">Discography</button>
        </div>

        <div id="profile" class="content-section active">
            <div class="w-full aspect-[21/9] bg-gray-50 mb-20 overflow-hidden border border-gray-100">
                <img id="group-banner" src="" class="w-full h-full object-cover">
            </div>
            <h2 class="text-3xl logo-font mb-12 uppercase italic border-l-8 border-black pl-6">Member</h2>
            <div id="member-grid" class="grid grid-cols-2 lg:grid-cols-3 gap-x-10 gap-y-20"></div>
        </div>

        <div id="disco" class="content-section py-20">
            <h2 class="text-3xl logo-font mb-12 uppercase italic border-l-8 border-black pl-6">Discography</h2>
            <div id="disco-list" class="grid grid-cols-1 gap-10 text-center"></div>
        </div>
    </main>

    <footer>
        <div class="f-logo logo-font">TVT</div>
        <p>&copy; Teyvat Entertainment All Rights Reserved.</p>
    </footer>

    <script>
        const params = new URLSearchParams(window.location.search);
        const groupId = params.get('id');
        const data = allGroups[groupId];

        if (data) {
            document.title = `${data.name} | TVT Official`;
            document.getElementById('group-name').innerText = data.name;
            document.getElementById('group-concept').innerText = data.concept;
            document.getElementById('group-banner').src = data.banner;

            const memberGrid = document.getElementById('member-grid');
            data.members.forEach(m => {
                memberGrid.innerHTML += `
                    <div class="member-card">
                        <div class="aspect-square overflow-hidden bg-gray-50 border border-gray-100 mb-6">
                            <img src="${m.img}" class="w-full h-full object-cover" onerror="this.src='https://placehold.jp/400x400.png?text=NO+IMAGE'">
                        </div>
                        <p class="logo-font text-2xl uppercase tracking-wider">${m.name}</p>
                        <p class="text-[10px] text-gray-400 font-bold mt-2 uppercase tracking-widest">${m.div} / ${m.pos}</p>
                    </div>
                `;
            });

            const discoList = document.getElementById('disco-list');
            if (data.discography.length === 0) {
                discoList.innerHTML = '<p class="logo-font text-gray-200 text-3xl italic">Coming Soon</p>';
            } else {
                data.discography.forEach(d => {
                    discoList.innerHTML += `
                        <div class="bg-gray-50 p-10 border border-gray-100 text-left">
                            <p class="text-[9px] text-gray-400 uppercase tracking-widest mb-2">${d.type} / ${d.date}</p>
                            <h3 class="text-2xl logo-font mb-6 italic">${d.title}</h3>
                            <div class="aspect-video bg-black flex items-center justify-center text-white text-xs italic">MUSIC VIDEO AREA</div>
                        </div>
                    `;
                });
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
        }
    </script>
</body>
</html>
