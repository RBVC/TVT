<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist | TVT Official</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="group.js"></script>
</head>
<body>
    <header>
        <a href="index.html" class="logo">TVT</a>
        <div class="menu-trigger" id="menu-btn">
            <span></span><span></span><span></span>
        </div>
    </header>

    <div class="nav-overlay" id="nav-menu">
        <a href="index.html#artists" class="menu-close">ARTISTS</a>
        <a href="wiki.html" class="menu-close">WIKI</a>
    </div>

    <main class="max-w-6xl mx-auto px-6 py-24">
        <div class="text-center mb-16 pt-16">
            <a href="index.html#artists" class="text-[10px] text-gray-300 uppercase tracking-[0.4em] mb-6 inline-block hover:text-black transition font-bold">← ALL ARTISTS</a>
            <h1 id="group-name" class="logo-font text-6xl md:text-[8rem] leading-none">Artist</h1>
        </div>

        <div class="flex justify-center space-x-12 mb-16 border-b border-gray-100">
            <button onclick="switchTab('profile')" id="btn-profile" class="tab-btn active uppercase">Profile</button>
            <button onclick="switchTab('disco')" id="btn-disco" class="tab-btn uppercase">Discography</button>
        </div>

        <div id="profile" class="content-section block">
            <div class="w-full aspect-[21/9] bg-gray-50 mb-20 overflow-hidden border border-gray-100 shadow-sm">
                <img id="group-banner" src="" class="w-full h-full object-cover">
            </div>
            <h2 class="text-3xl logo-font mb-12 uppercase border-l-8 border-black pl-6">Member</h2>
            
            <div id="member-grid" class="member-flex-container"></div>
        </div>

        <div id="disco" class="content-section hidden">
            <h2 class="text-3xl logo-font mb-12 uppercase border-l-8 border-black pl-6">Discography</h2>
            <div id="disco-list" class="grid grid-cols-1 gap-10 text-center"></div>
        </div>
    </main>

    <footer>
        <div class="f-logo">TVT</div>
        <p>&copy; Teyvat Entertainment All Rights Reserved.</p>
    </footer>

    <script>
        const params = new URLSearchParams(window.location.search);
        const groupId = params.get('id') || 'gen1us';
        const data = allGroups[groupId];

        if (data) {
            document.title = `${data.name} | TVT Official`;
            document.getElementById('group-name').innerText = data.name;
            document.getElementById('group-banner').src = data.banner;

            const memberGrid = document.getElementById('member-grid');
            
            // レイアウトクラスを付与
            memberGrid.classList.add('layout-' + (data.layout || 4));

            data.members.forEach((m) => {
                memberGrid.innerHTML += `
                    <div class="member-card text-left">
                        <div class="aspect-square overflow-hidden bg-gray-50 border border-gray-100 mb-6">
                            <img src="${m.img}" class="w-full h-full object-cover" onerror="this.src='https://placehold.jp/400x400.png?text=NO+IMAGE'">
                        </div>
                        <p class="logo-font text-2xl leading-none" style="text-transform: none;">${m.name}</p>
                        <p class="text-[12px] text-black font-black mt-4 tracking-widest" style="text-transform: none;">${m.div}</p>
                        <p class="text-[10px] text-gray-400 mt-1 tracking-widest leading-relaxed" style="text-transform: none;">${m.pos}</p>
                    </div>
                `;
            });
        }

        function switchTab(tabName) {
            document.querySelectorAll('.content-section').forEach(s => { s.classList.add('hidden'); s.classList.remove('block'); });
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabName).classList.remove('hidden');
            document.getElementById(tabName).classList.add('block');
            document.getElementById('btn-' + tabName).classList.add('active');
        }

        const menuBtn = document.getElementById('menu-btn');
        const navMenu = document.getElementById('nav-menu');
        menuBtn.onclick = () => { 
            menuBtn.classList.toggle('active'); 
            navMenu.classList.toggle('open'); 
            document.body.style.overflow = navMenu.classList.contains('open') ? 'hidden' : 'auto';
        };
    </script>
</body>
</html>
