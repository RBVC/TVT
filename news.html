<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News | TVT Official</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="group.js"></script>
    <script src="common.js"></script>
    <style>
        body { background: #000; color: #fff; }
        .project-title { font-size: 5rem; line-height: 0.9; }
        .team-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); padding: 40px; margin-bottom: 40px; }
        .member-unit { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .m-img-circle { width: 60px; height: 60px; border-radius: 50%; overflow: hidden; border: 1px solid #444; }
        .m-img-circle img { width: 100%; height: 100%; object-fit: cover; }
        .role-badge { font-size: 0.6rem; color: #aaa; border: 1px solid #444; padding: 1px 6px; display: inline-block; margin-bottom: 3px; }
        @media (max-width: 768px) { .project-title { font-size: 2.5rem; } }
    </style>
</head>
<body>
    <div id="common-header"></div>

    <main class="pt-32 pb-24">
        <div class="max-w-6xl mx-auto px-6">
            <div class="text-center mb-20">
                <p class="text-gray-500 uppercase tracking-[0.5em] mb-4">Teyvat Times Special</p>
                <h1 id="p-title" class="logo-font project-title uppercase mb-8"></h1>
                <p id="p-tagline" class="text-xl italic text-gray-400 font-serif"></p>
            </div>

            <div class="w-full aspect-video bg-zinc-900 mb-24 overflow-hidden border border-zinc-800">
                <img id="p-visual" src="" class="w-full h-full object-cover">
            </div>

            <div class="max-w-3xl mx-auto text-center mb-32">
                <p id="p-desc" class="text-lg leading-loose text-gray-300"></p>
            </div>

            <div id="teams-container" class="grid grid-cols-1 md:grid-cols-2 gap-10">
                <!-- JSで動的に流し込み -->
            </div>
        </div>
    </main>

    <div id="common-footer"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const projectId = params.get('id');
        const project = specialProjects[projectId];

        if (project) {
            document.title = `${project.title} | Teyvat Times`;
            document.getElementById('p-title').innerText = project.title;
            document.getElementById('p-tagline').innerText = project.tagline;
            document.getElementById('p-visual').src = project.mainVisual;
            document.getElementById('p-desc').innerText = project.description;

            const container = document.getElementById('teams-container');
            project.teams.forEach(team => {
                let memberHtml = team.members.map(m => `
                    <div class="member-unit">
                        <div class="m-img-circle">
                            <img src="${m.img}" onerror="this.src='https://placehold.jp/100x100.png?text=NO+IMAGE'">
                        </div>
                        <div class="text-left">
                            <span class="role-badge">${m.role}</span>
                            <p class="logo-font text-xl uppercase">${m.name}</p>
                        </div>
                    </div>
                `).join('');

                container.innerHTML += `
                    <div class="team-card">
                        <p class="text-[10px] text-gray-500 uppercase tracking-widest mb-4">Role Model: ${team.model}</p>
                        <h2 class="logo-font text-4xl mb-12 border-b border-gray-800 pb-4">${team.name}</h2>
                        <div class="grid grid-cols-1 gap-2">
                            ${memberHtml}
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
