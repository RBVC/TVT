<!-- --- START OF FILE news.html --- -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News | TVT Official</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 💡 プロジェクトデータを読み込み -->
    <script src="data/project/heaventeen.js"></script>
    <script src="data/project/nightfall-ops.js"></script>
    <script src="data/project/the-sovereign.js"></script>
    <script src="common.js"></script>
    
    <style>
        body { background: #000; color: #fff; }
        .project-title { font-size: 3rem; font-weight: 900; line-height: 1.1; margin-bottom: 40px; }
        .team-section { margin-bottom: 100px; }
        .member-grid-news { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        .member-card-news { position: relative; cursor: pointer; overflow: hidden; background: #111; }
        .member-card-news .img-wrap { aspect-ratio: 1 / 1; overflow: hidden; }
        .member-card-news img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; filter: brightness(0.8); }
        .member-card-news:hover img { transform: scale(1.05); filter: brightness(1); }
        .member-card-news .name-label { padding: 15px; text-align: left; font-size: 1.2rem; font-weight: 900; border-top: 1px solid #222; }
        @media (max-width: 1024px) { .member-grid-news { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) { .project-title { font-size: 2rem; } }
    </style>
</head>
<body>
    <div id="common-header"></div>
    <main class="pt-32 pb-24">
        <div class="max-w-6xl mx-auto px-6">
            <div class="text-center"><h1 id="p-title" class="logo-font project-title uppercase bold-title"></h1></div>
            <div class="w-full aspect-video bg-zinc-900 mb-24 overflow-hidden border border-zinc-800 shadow-2xl">
                <img id="p-visual" src="" class="w-full h-full object-cover">
            </div>
            <div id="teams-container" class="space-y-24"></div>
        </div>
    </main>

    <div id="cast-modal" class="modal-overlay" onclick="closeCast()">
        <div class="modal-container" onclick="event.stopPropagation()">
            <span class="modal-close" onclick="closeCast()">&times;</span>
            <iframe id="cast-frame" class="modal-iframe" src=""></iframe>
        </div>
    </div>

    <div id="common-footer"></div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const projectId = params.get('id');
        const project = specialProjects[projectId];
        
        if (project) {
            document.getElementById('p-title').innerText = project.title;
            document.getElementById('p-visual').src = project.mainVisual;
            const container = document.getElementById('teams-container');
            
            project.teams.forEach((team, tIdx) => {
                let memberHtml = team.members.map((m, mIdx) => `
                    <div class="member-card-news" onclick="openCast('${projectId}', ${tIdx}, ${mIdx})">
                        <div class="img-wrap"><img src="${project.basePath + m.img}" onerror="this.src='https://placehold.jp/400x400.png?text=${m.name}'"></div>
                        <p class="name-label">${m.name}</p>
                    </div>`).join('');
                
                container.innerHTML += `
                    <div class="team-section">
                        <div class="text-left"><h2 class="logo-font text-2xl font-bold uppercase border-b border-zinc-800 pb-3 mb-8">${team.name}</h2></div>
                        <div class="member-grid-news">${memberHtml}</div>
                    </div>`;
            });
        }

        function openCast(pid, tidx, midx) {
            const frame = document.getElementById('cast-frame');
            frame.src = `cast.html?pid=${pid}&tidx=${tidx}&midx=${midx}`;
            document.getElementById('cast-modal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }
        function closeCast() {
            document.getElementById('cast-modal').style.display = 'none';
            document.getElementById('cast-frame').src = '';
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
