<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News | TVT Official</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="group.js"></script>
    <script src="common.js"></script>
    <style>
        body { background: #000; color: #fff; }
        .project-title { font-size: 5rem; line-height: 0.9; }
        .team-section { margin-bottom: 150px; }
        
        /* メンバーカード */
        .member-grid-news { display: grid; grid-template-columns: repeat(4, 1fr); gap: 50px 20px; }
        .member-unit { text-align: center; display: flex; flex-direction: column; align-items: center; }
        .m-img-box { width: 140px; height: 140px; border-radius: 50%; overflow: hidden; margin-bottom: 25px; border: 2px solid #222; }
        .m-img-box img { width: 100%; height: 100%; object-fit: cover; }
        
        /* テキスト書式 */
        .role-badge { font-family: 'Rajdhani', sans-serif; font-size: 0.8rem; color: #fff; background: #222; padding: 2px 12px; display: inline-block; margin-bottom: 10px; letter-spacing: 0.05em; }
        .m-name { font-size: 1.8rem; margin-bottom: 5px; line-height: 1; }
        .m-pos { font-size: 0.65rem; color: #666; margin-bottom: 20px; font-weight: 800; border-bottom: 1px solid #333; padding-bottom: 5px; width: 100%; }
        .m-desc { font-size: 0.85rem; color: #aaa; line-height: 1.6; max-width: 280px; text-align: left; }

        @media (max-width: 1024px) { .member-grid-news { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) { .project-title { font-size: 2.5rem; } .m-img-box { width: 120px; height: 120px; } }
    </style>
</head>
<body>
    <div id="common-header"></div>

    <main class="pt-32 pb-24">
        <div class="max-w-6xl mx-auto px-6">
            <!-- Header -->
            <div class="text-center mb-20">
                <p class="text-gray-500 uppercase tracking-[0.5em] mb-4">Teyvat Times Special Report</p>
                <h1 id="p-title" class="logo-font project-title uppercase mb-8"></h1>
                <p id="p-tagline" class="text-xl italic text-gray-400 font-serif"></p>
            </div>

            <!-- Main Visual -->
            <div class="w-full aspect-video bg-zinc-900 mb-24 overflow-hidden border border-zinc-800 shadow-2xl">
                <img id="p-visual" src="" class="w-full h-full object-cover">
            </div>

            <!-- Intro: 1行に統合 -->
            <div class="max-w-4xl mx-auto text-center mb-40">
                <p id="p-desc" class="text-lg md:text-xl leading-loose text-gray-200 font-light tracking-wider"></p>
            </div>

            <!-- Teams -->
            <div id="teams-container" class="space-y-40">
                <!-- JSで動的に流し込み -->
            </div>
        </div>
    </main>

    <div id="common-footer"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const projectId = params.get('id');
        const project = specialProjects[projectId];

        if (project) {
            document.title = `${project.title} | Teyvat Times`;
            document.getElementById('p-title').innerText = project.title;
            document.getElementById('p-tagline').innerText = project.tagline;
            document.getElementById('p-visual').src = project.mainVisual;
            document.getElementById('p-desc').innerText = project.description;

            const container = document.getElementById('teams-container');
            project.teams.forEach(team => {
                const folder = team.name.toLowerCase().includes('mafia') ? 'mafia' : 'police';

                let memberHtml = team.members.map(m => {
                    const imgPath = `images/mafia_vs_police/${folder}/${m.name.toLowerCase()}.jpg`;
                    return `
                        <div class="member-unit">
                            <div class="m-img-box">
                                <img src="${imgPath}" onerror="this.src='https://placehold.jp/30/111111/333333/300x300.png?text=${m.name}'">
                            </div>
                            <span class="role-badge">${m.role}</span>
                            <p class="logo-font m-name uppercase">${m.name}</p>
                            <p class="m-pos uppercase">${m.pos}</p>
                            <p class="m-desc">${m.desc}</p>
                        </div>
                    `;
                }).join('');

                container.innerHTML += `
                    <div class="team-section">
                        <div class="text-center mb-20">
                            <h2 class="logo-font text-7xl md:text-9xl border-b border-zinc-800 pb-8 inline-block">${team.name}</h2>
                        </div>
                        <div class="member-grid-news">
                            ${memberHtml}
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
