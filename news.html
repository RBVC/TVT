<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News | TVT Official</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="group.js"></script>
    <script src="common.js"></script>
    <style>
        body { background: #000; color: #fff; }
        .project-title { font-size: 5rem; line-height: 0.9; }
        .team-section { margin-bottom: 100px; }
        .team-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); padding: 40px; }
        
        .member-unit { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .m-img-box { width: 120px; height: 120px; border-radius: 50%; overflow: hidden; margin-bottom: 20px; border: 2px solid #333; transition: 0.3s; }
        .member-unit:hover .m-img-box { border-color: #fff; transform: scale(1.05); }
        .m-img-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .role-badge { font-family: 'Rajdhani', sans-serif; font-size: 0.7rem; color: #fff; background: #333; padding: 2px 10px; display: inline-block; margin-bottom: 8px; letter-spacing: 0.1em; }
        .m-pos { font-size: 0.7rem; color: #666; margin-bottom: 15px; font-weight: bold; }
        .m-desc { font-size: 0.85rem; color: #aaa; line-height: 1.6; max-width: 300px; }

        @media (max-width: 768px) { .project-title { font-size: 2.5rem; } .m-img-box { width: 100px; height: 100px; } }
    </style>
</head>
<body>
    <div id="common-header"></div>

    <main class="pt-32 pb-24">
        <div class="max-w-6xl mx-auto px-6">
            <div class="text-center mb-20">
                <p class="text-gray-500 uppercase tracking-[0.5em] mb-4">Teyvat Times Special</p>
                <h1 id="p-title" class="logo-font project-title uppercase mb-8"></h1>
                <p id="p-tagline" class="text-xl italic text-gray-400 font-serif"></p>
            </div>

            <div class="w-full aspect-video bg-zinc-900 mb-24 overflow-hidden border border-zinc-800">
                <img id="p-visual" src="" class="w-full h-full object-cover">
            </div>

            <div class="max-w-3xl mx-auto text-center mb-32">
                <p id="p-desc" class="text-lg leading-loose text-gray-300"></p>
            </div>

            <div id="teams-container" class="space-y-32">
                <!-- JSで動的に流し込み -->
            </div>
        </div>
    </main>

    <div id="common-footer"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const projectId = params.get('id');
        const project = specialProjects[projectId];

        if (project) {
            document.title = `${project.title} | Teyvat Times`;
            document.getElementById('p-title').innerText = project.title;
            document.getElementById('p-tagline').innerText = project.tagline;
            document.getElementById('p-visual').src = project.mainVisual;
            document.getElementById('p-desc').innerText = project.description;

            const container = document.getElementById('teams-container');
            project.teams.forEach(team => {
                let memberHtml = team.members.map(m => `
                    <div class="member-unit">
                        <div class="m-img-box">
                            <img src="${m.img}" onerror="this.src='https://placehold.jp/200x200.png?text=ARTIST'">
                        </div>
                        <span class="role-badge">${m.role}</span>
                        <p class="logo-font text-2xl uppercase mb-1">${m.name}</p>
                        <p class="m-pos uppercase">${m.pos}</p>
                        <p class="m-desc">${m.desc}</p>
                    </div>
                `).join('');

                container.innerHTML += `
                    <div class="team-section">
                        <div class="text-center mb-16">
                            <p class="text-[10px] text-gray-500 uppercase tracking-widest mb-2">Role Model: ${team.model}</p>
                            <h2 class="logo-font text-6xl border-b border-gray-800 pb-6 inline-block">${team.name}</h2>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-x-6 gap-y-10">
                            ${memberHtml}
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
