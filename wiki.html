<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVT Wiki | 内部機密資料</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="group.js"></script>
    <script src="project.js"></script>
    <script src="common.js"></script>
    <style>
        /* 🆕 完全にTVT Officialデザインへ移行 */
        body { background-color: #ffffff; color: #000000; }
        .wiki-container { max-width: 1100px; margin: 0 auto; background: white; padding: 60px 40px; }
        
        h1 { font-family: 'Source Han Sans JP', sans-serif; font-size: 3.5rem; font-weight: 900; border-bottom: 2px solid #000; margin-bottom: 4rem; padding-bottom: 20px; }
        
        /* 💡 修正：セクション間に大きな余白 */
        section { margin-bottom: 8rem; }

        h2 { font-family: 'Source Han Sans JP', sans-serif; font-size: 2rem; font-weight: 900; border-bottom: 1px solid #eee; margin-bottom: 3rem; display: flex; align-items: center; justify-content: space-between; cursor: pointer; padding-bottom: 15px; }
        h2::before { content: ""; display: inline-block; width: 10px; height: 2rem; background: #000; margin-right: 15px; }
        
        h3 { font-family: 'Source Han Sans JP', sans-serif; font-size: 1.4rem; font-weight: 900; margin-top: 2rem; margin-bottom: 1rem; color: #000; display: flex; align-items: center; justify-content: space-between; cursor: pointer; border-bottom: 1px solid #f0f0f0; padding: 15px 0; }

        .toggle-btn { font-size: 0.7rem; color: #999; font-weight: 700; text-transform: uppercase; border: 1px solid #eee; padding: 2px 8px; border-radius: 2px; }

        .toc-box { background: #fafafa; border: 1px solid #f0f0f0; padding: 30px; display: inline-block; width: 100%; max-width: 450px; margin: 40px 0 80px; }
        .toc-title { font-weight: 900; text-align: center; margin-bottom: 20px; border-bottom: 2px solid #000; padding-bottom: 10px; }
        .toc-box a { color: #000; text-decoration: none; font-weight: 700; transition: 0.2s; }
        .toc-box a:hover { opacity: 0.5; }

        .table-wrapper { overflow-x: auto; margin-bottom: 2rem; border: 1px solid #f0f0f0; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 900px; }
        th, td { border: 1px solid #f0f0f0; padding: 15px; text-align: left; vertical-align: top; }
        th { background-color: #fafafa; font-weight: 900; }
        
        .matrix-table th, .matrix-table td { width: 14.28%; text-align: center; }
        .matrix-ceo { font-size: 0.7rem; color: #aaa; font-weight: 400; display: block; margin-top: 10px; }
        
        .detail-table { table-layout: fixed; min-width: 800px; }
        .detail-table th:nth-child(1) { width: 80px; }
        .member-img { width: 55px; height: 55px; object-fit: cover; border: 1px solid #eee; }
        .collapsible-content.collapsed { display: none; }
        
        @media (max-width: 768px) { .wiki-container { padding: 20px; } h1 { font-size: 2.2rem; } }
    </style>
</head>
<body>
    <div id="common-header"></div>
    <main class="wiki-container">
        <!-- 💡 修正：タイトル周りの余白を大幅に強化 -->
        <div style="padding-top: 60px; margin-bottom: 60px;">
            <h1>Teyvat Entertainment 内部機密資料</h1>
        </div>
        
        <nav class="toc-box">
            <div class="toc-title">目次</div>
            <ul style="list-style:none; padding:0; line-height: 2;">
                <li>1. <a href="#sec-affiliates">所属アーティスト・マトリックス</a></li>
                <li>2. <a href="#sec-details">グループ詳細設定</a></li>
                <li>3. <a href="#sec-projects">プロジェクト一覧</a></li>
            </ul>
        </nav>

        <section id="sec-affiliates">
            <h2 onclick="toggleSection('matrix-content', 'matrix-btn')">所属アーティスト・マトリックス <span class="toggle-btn" id="matrix-btn">非表示</span></h2>
            <div class="collapsible-content mt-12" id="matrix-content">
                <div class="table-wrapper"><table class="matrix-table"><thead id="matrix-header"><tr><th style="background:#f0f0f0">グループ名</th></tr></thead><tbody id="matrix-body"></tbody></table></div>
            </div>
        </section>

        <section id="sec-details">
            <h2 onclick="toggleSection('details-content', 'details-btn')">グループ詳細設定 <span class="toggle-btn" id="details-btn">非表示</span></h2>
            <div class="collapsible-content mt-12" id="details-content"></div>
        </section>

        <section id="sec-projects">
            <h2 onclick="toggleSection('projects-content', 'projects-btn')">プロジェクト一覧 <span class="toggle-btn" id="projects-btn">表示</span></h2>
            <div class="collapsible-content mt-12" id="projects-content">
                <div id="special-projects-area"></div>
                <h3 onclick="toggleSection('heaventeen-table', 'btn-heaventeen')">HEAVENTEEN 全記録 <span class="toggle-btn" id="btn-heaventeen">表示</span></h3>
                <div class="table-wrapper collapsible-content collapsed" id="heaventeen-table">
                    <table><thead><tr><th>名前</th><th>0次</th><th>1次</th><th>2次</th><th>最終</th><th>結果</th></tr></thead><tbody id="heaventeen-body"></tbody></table>
                </div>
            </div>
        </section>
    </main>
    <div id="common-footer"></div>
    <script>
        const mHead = document.getElementById('matrix-header').rows[0];
        const mBody = document.getElementById('matrix-body');
        Object.keys(labels).forEach(k => { const label = labels[k]; mHead.innerHTML += `<th><span class="matrix-label">${label.name.replace(' ','<br>')}</span><span class="matrix-ceo">${label.ceo}</span></th>`; });
        Object.keys(allGroups).forEach(gk => { const g = allGroups[gk]; let row = `<tr><td class="font-bold" style="background:#fdfdfd">${g.name}</td>`; Object.keys(labels).forEach(lk => { const mems = g.members.filter(m => m.label === lk && !m.isFormer).map(m => m.name).join('<br>'); row += `<td>${mems || '-'}</td>`; }); mBody.innerHTML += row + '</tr>'; });

        const dArea = document.getElementById('details-content');
        Object.keys(allGroups).forEach(gk => { const g = allGroups[gk]; let html = `<h3 onclick="toggleSection('det-${gk}', 'btn-${gk}')">${g.name} <span class="toggle-btn" id="btn-${gk}">表示</span></h3><div id="det-${gk}" class="table-wrapper collapsible-content collapsed"><table class="detail-table"><thead><tr><th>画像</th><th>名前</th><th>出身</th><th>ポジション</th><th>レーベル</th></tr></thead><tbody>`;
            g.members.forEach(m => { html += `<tr ${m.isFormer ? 'style="color:#bbb"' : ''}><td class="text-center">${m.img ? `<img src="${g.basePath + m.img}" class="member-img">` : '-'}</td><td>${m.isLeader ? `<b>${m.name} (Leader)</b>` : m.name}${m.isFormer ? ' (元メンバー)' : ''}</td><td>${m.div}</td><td>${m.isLeader ? 'Leader / ' + m.pos : m.pos}</td><td class="logo-font">${labels[m.label].name}</td></tr>`; });
            dArea.innerHTML += html + `</tbody></table></div>`;
        });

        const sArea = document.getElementById('special-projects-area');
        Object.keys(specialProjects).forEach(pk => { const p = specialProjects[pk]; let html = `<h3 onclick="toggleSection('proj-${pk}', 'btn-${pk}')">${p.title} <span class="toggle-btn" id="btn-${pk}">表示</span></h3><div id="proj-${pk}" class="collapsible-content collapsed p-8 bg-gray-50 border border-gray-100 mb-10"><p class="text-sm font-bold mb-4">"${p.tagline}"</p><p class="text-sm mb-6">${p.description}</p>`;
            p.teams.forEach(team => { html += `<div class="mb-6"><p class="text-xs font-bold border-b pb-1 mb-2 uppercase">${team.name}</p><p class="text-xs text-gray-600">${team.members.map(m => `${m.name} (${m.role})`).join(', ')}</p></div>`; });
            sArea.innerHTML += html + `</div>`;
        });

        const hvBody = document.getElementById('heaventeen-body');
        heaventeenResults.forEach(r => { hvBody.innerHTML += `<tr ${r.final === 99 ? 'style="color:#bbb"' : ''}><td>${r.name}</td><td>${r.rank0}位</td><td>${r.rank1===99?'脱落':r.rank1+'位'}</td><td>${r.rank2===99?'脱落':r.rank2+'位'}</td><td>${r.final===99?'-':r.final+'位'}</td><td>${r.result}</td></tr>`; });

        function toggleSection(cId, bId) { const c = document.getElementById(cId); const b = document.getElementById(bId); c.classList.toggle('collapsed'); b.innerText = c.classList.contains('collapsed') ? "表示" : "非表示"; }
    </script>
</body>
</html>
