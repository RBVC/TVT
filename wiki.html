<!-- --- START OF FILE wiki.html --- -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVT Wiki | 内部機密資料</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 💡 分割されたデータファイルを順番に読み込み -->
    <script src="data/wiki.js"></script>
    <script src="data/matrix.js"></script>
    <!-- 本来はここで全グループ読み込みますが、今回は進捗確認のためgen1usのみ -->
    <script src="data/group/gen1us.js"></script>
    
    <script src="common.js"></script>
    <style>
        body { background-color: #ffffff; color: #000000; }
        .wiki-container { max-width: 1100px; margin: 0 auto; background: white; padding: 60px 40px; }
        h1 { font-family: 'Source Han Sans JP', sans-serif; font-size: 3.5rem; font-weight: 900; border-bottom: 2px solid #000; margin-bottom: 4rem; padding-bottom: 20px; }
        section { margin-bottom: 8rem; }
        h2 { font-family: 'Source Han Sans JP', sans-serif; font-size: 2rem; font-weight: 900; border-bottom: 1px solid #eee; margin-bottom: 3rem; display: flex; align-items: center; justify-content: space-between; cursor: pointer; padding-bottom: 15px; }
        h2::before { content: ""; display: inline-block; width: 10px; height: 2rem; background: #000; margin-right: 15px; }
        .toc-box { background: #fafafa; border: 1px solid #f0f0f0; padding: 30px; display: inline-block; width: 100%; max-width: 450px; margin: 40px 0 80px; }
        .table-wrapper { overflow-x: auto; margin-bottom: 2rem; border: 1px solid #f0f0f0; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 900px; }
        th, td { border: 1px solid #f0f0f0; padding: 15px; text-align: left; vertical-align: top; }
        th { background-color: #fafafa; font-weight: 900; }
        .member-img { width: 55px; height: 55px; object-fit: cover; border: 1px solid #eee; }
        .collapsible-content.collapsed { display: none; }
        .toggle-btn { font-size: 0.7rem; color: #999; font-weight: 700; border: 1px solid #eee; padding: 2px 8px; border-radius: 2px; }
        
        /* Wiki限定：機密資料セクションのスタイル */
        .confidential-box { background: #fff9f9; border: 1px solid #ffebeb; padding: 30px; margin-top: 20px; }
        .conf-title { color: #d32f2f; font-weight: 900; letter-spacing: 0.2em; font-size: 0.7rem; margin-bottom: 20px; border-bottom: 1px solid #ffebeb; padding-bottom: 10px; }
        .ratio-list { font-size: 0.75rem; color: #666; line-height: 2; }
    </style>
</head>
<body>
    <div id="common-header"></div>
    <main class="wiki-container">
        <div style="padding-top: 60px; margin-bottom: 60px;">
            <h1 class="bold-title">Teyvat Entertainment 内部機密資料</h1>
        </div>
        
        <nav class="toc-box">
            <div class="font-bold text-center mb-4 border-b pb-2">目次</div>
            <ul style="list-style:none; padding:0; line-height: 2;">
                <li>1. <a href="#sec-affiliates">所属アーティスト・マトリックス</a></li>
                <li>2. <a href="#sec-details">グループ詳細設定</a></li>
                <li>3. <a href="#sec-projects">プロジェクト一覧</a></li>
            </ul>
        </nav>

        <section id="sec-affiliates">
            <h2 onclick="toggleSection('matrix-content', 'matrix-btn')">所属アーティスト・マトリックス <span class="toggle-btn" id="matrix-btn">非表示</span></h2>
            <div class="collapsible-content mt-12" id="matrix-content">
                <div class="table-wrapper">
                    <table class="matrix-table">
                        <thead id="matrix-header"><tr><th>グループ名</th></tr></thead>
                        <tbody id="matrix-body"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section id="sec-details">
            <h2 onclick="toggleSection('details-content', 'details-btn')">グループ詳細設定 <span class="toggle-btn" id="details-btn">非表示</span></h2>
            <div class="collapsible-content mt-12" id="details-content">
                <!-- ここにJSでグループ詳細が生成されます -->
            </div>
        </section>

        <section id="sec-projects">
            <h2 onclick="toggleSection('projects-content', 'projects-btn')">プロジェクト一覧 <span class="toggle-btn" id="projects-btn">表示</span></h2>
            <div class="collapsible-content mt-12 collapsed" id="projects-content">
                <div id="special-projects-area"></div>
            </div>
        </section>
    </main>
    <div id="common-footer"></div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // マトリックス生成（matrix.jsの関数を呼び出し）
            if (typeof initAffiliationMatrix === 'function') initAffiliationMatrix();
            
            // グループ詳細の生成
            const dArea = document.getElementById('details-content');
            Object.keys(allGroups).forEach(gk => {
                const g = allGroups[gk];
                let html = `
                <div class="mb-24">
                    <h3 onclick="toggleSection('det-${gk}', 'btn-${gk}')" style="font-size:1.8rem; font-weight:900; cursor:pointer; border-bottom:2px solid #000; padding:15px 0; display:flex; justify-content:space-between; align-items:center;">
                        ${g.name} <span class="toggle-btn" id="btn-${gk}">表示</span>
                    </h3>
                    <div id="det-${gk}" class="collapsible-content collapsed pt-8">
                        ${g.description ? `<p class="text-sm leading-relaxed text-gray-700 mb-8">${g.description}</p>` : ''}
                        ${g.units ? `<p class="text-xs font-bold mb-6">所属ユニット: ${g.units.map(u => `<span class="inline-block bg-black text-white px-2 py-1 mr-2">${u}</span>`).join('')}</p>` : ''}
                        
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th style="width:80px">画像</th>
                                        <th style="width:160px">名前</th>
                                        <th style="width:230px">ポジション</th>
                                        <th style="width:150px">レーベル</th>
                                        <th>備考 (Remarks)</th>
                                    </tr>
                                </thead>
                                <tbody>`;
                                
                g.members.forEach(m => {
                    html += `
                        <tr ${m.isFormer ? 'style="color:#bbb"' : ''}>
                            <td class="text-center">${m.img ? `<img src="${g.basePath + m.img}" class="member-img">` : '-'}</td>
                            <td>${m.isLeader ? `<b>${m.name} (Leader)</b>` : m.name}</td>
                            <td>${m.pos}</td>
                            <td class="logo-font text-[10px]">${labels[m.label].name}</td>
                            <td class="text-[11px]">${m.remarks || '-'}</td>
                        </tr>`;
                });
                
                html += `</tbody></table></div>`;

                // 💡 内部機密資料セクションの追加（データがある場合のみ）
                if (g.confidential) {
                    const conf = g.confidential;
                    html += `
                    <div class="confidential-box">
                        <div class="conf-title">CONFIDENTIAL: 内部機密資料</div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div>
                                <p class="text-[11px] font-bold mb-2">【年齢階層】</p>
                                <ul class="text-[11px] space-y-1 mb-6">
                                    ${conf.ageTeams.map(t => `<li><b>${t.name}:</b> ${t.members}</li>`).join('')}
                                </ul>
                                <p class="text-[11px] font-bold mb-2">【公式カップリング】</p>
                                <p class="text-[11px] text-gray-500">${conf.couplings.join(' / ')}</p>
                            </div>
                            <div>
                                <p class="text-[11px] font-bold mb-2">【ポジション比率】</p>
                                <div class="ratio-list">
                                    <p>VOCAL: ${conf.ratios.vocal}</p>
                                    <p>RAP: ${conf.ratios.rap}</p>
                                    <p>DANCE: ${conf.ratios.dance}</p>
                                </div>
                            </div>
                        </div>
                    </div>`;
                }

                html += `</div></div>`;
                dArea.innerHTML += html;
            });
        });
    </script>
</body>
</html>
