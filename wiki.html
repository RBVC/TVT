<!-- --- START OF FILE wiki.html --- -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVT Wiki | 内部機密資料</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="data/wiki.js"></script>
    <script src="data/matrix.js"></script>
    <script src="data/group/gen1us.js"></script>
    <script src="data/group/4ggravate.js"></script>
    <script src="data/group/6reeze.js"></script>
    <script src="data/group/universe.js"></script>
    <script src="data/group/house-of-the-hearth.js"></script>
    <script src="data/project/heaventeen.js"></script>
    <script src="data/project/nightfall-ops.js"></script>
    <script src="data/project/the-sovereign.js"></script>
    <script src="data/project/sun-and-moon.js"></script>
    <script src="common.js"></script>
    
    <style>
        body { background-color: #ffffff; color: #000000; font-size: 13px; }
        .wiki-container { max-width: 1100px; margin: 0 auto; background: white; padding: 120px 40px 60px; }
        h1 { font-family: 'Source Han Sans JP', sans-serif; font-size: 2rem; font-weight: 900; border-bottom: 2px solid #000; margin-bottom: 2rem; padding-bottom: 15px; }
        section { margin-bottom: 4rem; }
        h2 { font-family: 'Source Han Sans JP', sans-serif; font-size: 1.2rem; font-weight: 900; border-bottom: 1px solid #eee; margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between; cursor: pointer; padding-bottom: 10px; }
        h2::before { content: ""; display: inline-block; width: 6px; height: 1.4rem; background: #000; margin-right: 12px; }
        .sub-header { font-size: 1.1rem !important; font-weight: 900; cursor: pointer; border-bottom: 1px solid #f0f0f0; padding: 12px 0; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .sub-header:hover { color: #666; }
        .toc-box { background: #fafafa; border: 1px solid #f0f0f0; padding: 25px; display: inline-block; width: 100%; max-width: 450px; margin-bottom: 60px; }
        .toc-title { font-weight: 900; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 8px; font-size: 11px; letter-spacing: 0.1em; }
        .toc-list { list-style: none; padding: 0; margin: 0; line-height: 2; }
        .toc-list li { margin-bottom: 5px; }
        .toc-list a { color: #000; text-decoration: none; font-weight: 700; font-size: 12px; }
        .toc-sub-list { list-style: none; padding-left: 20px; margin-top: 5px; }
        .toc-sub-list a { color: #888; font-weight: 400; font-size: 11px; }
        .toc-sub-list a:hover { color: #000; }
        .table-wrapper { overflow-x: auto; margin-bottom: 1.5rem; border: 1px solid #f0f0f0; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 950px; table-layout: fixed; }
        th, td { border: 1px solid #f0f0f0; padding: 10px 8px; text-align: left; vertical-align: middle; line-height: 1.4; word-break: break-word; }
        th { background-color: #fafafa; font-weight: 900; color: #333; }
        .matrix-ceo { display: block; font-size: 10px; color: #999; font-weight: 400; margin-top: 3px; border-top: 1px solid #eee; padding-top: 3px; }
        .member-img { width: 45px; height: 45px; object-fit: cover; border: 1px solid #eee; display: block; margin: 0 auto; }
        .collapsible-content.collapsed { display: none; }
        .toggle-btn { font-size: 9px; color: #bbb; font-weight: 700; border: 1px solid #eee; padding: 2px 6px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="common-header"></div>
    <main class="wiki-container">
        <h1 class="bold-title">Teyvat Entertainment 内部機密資料</h1>
        <nav class="toc-box">
            <div class="toc-title">CONTENTS</div>
            <ul class="toc-list">
                <li><a href="#sec-affiliates">1. 所属アーティスト・マトリックス</a></li>
                <li><a href="#sec-details">2. グループ詳細設定</a><ul class="toc-sub-list" id="toc-groups"></ul></li>
                <li><a href="#sec-projects">3. プロジェクト一覧</a><ul class="toc-sub-list" id="toc-projects"></ul></li>
            </ul>
        </nav>
        <section id="sec-affiliates">
            <h2 onclick="toggleSection('matrix-content', 'matrix-btn')">所属アーティスト・マトリックス <span class="toggle-btn" id="matrix-btn">表示</span></h2>
            <div class="collapsible-content collapsed mt-6" id="matrix-content"><div class="table-wrapper"><table class="matrix-table"><thead id="matrix-header"><tr><th>グループ名</th></tr></thead><tbody id="matrix-body"></tbody></table></div></div>
        </section>
        <section id="sec-details">
            <h2 onclick="toggleSection('details-content', 'details-btn')">グループ詳細設定 <span class="toggle-btn" id="details-btn">表示</span></h2>
            <div id="details-content" class="collapsible-content collapsed mt-6"></div>
        </section>
        <section id="sec-projects">
            <h2 onclick="toggleSection('projects-content', 'projects-btn')">プロジェクト一覧 <span class="toggle-btn" id="projects-btn">表示</span></h2>
            <div id="projects-content" class="collapsible-content collapsed mt-6">
                <div id="special-projects-area"></div>
                <h3 onclick="toggleSection('heaventeen-table', 'btn-heaventeen')" class="sub-header" style="margin-top:40px;">HEAVENTEEN 全記録 <span class="toggle-btn" id="btn-heaventeen">表示</span></h3>
                <div class="table-wrapper collapsible-content collapsed" id="heaventeen-table"><table><thead><tr><th>名前</th><th>0次</th><th>1次</th><th>2次</th><th>最終</th><th>結果</th></tr></thead><tbody id="heaventeen-body"></tbody></table></div>
            </div>
        </section>
    </main>
    <div id="common-footer"></div>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof initAffiliationMatrix === 'function') initAffiliationMatrix();
            const dArea = document.getElementById('details-content');
            const sArea = document.getElementById('special-projects-area');
            const tocGroups = document.getElementById('toc-groups');
            const tocProjects = document.getElementById('toc-projects');

            Object.keys(allGroups).forEach(gk => {
                const g = allGroups[gk];
                tocGroups.innerHTML += `<li><a href="#det-anchor-${gk}">- ${g.name}</a></li>`;
                const formattedDescription = g.description ? g.description.replace(/\n/g, '<br>') : '';
                let html = `<div class="mb-10" id="det-anchor-${gk}"><h3 class="sub-header" onclick="toggleSection('det-${gk}', 'btn-${gk}')">${g.name} <span class="toggle-btn" id="btn-${gk}">表示</span></h3><div id="det-${gk}" class="collapsible-content collapsed pt-4"><p class="text-gray-700 mb-8 leading-relaxed text-[12px]">${formattedDescription}</p><div class="table-wrapper"><table><thead><tr><th style="width:70px">画像</th><th style="width:130px">名前</th><th style="width:100px">ディビジョン</th><th style="width:180px">ポジション</th>${g.members.some(m => m.subUnit && m.subUnit !== "-") ? '<th style="width:130px">所属ユニット</th>' : ''}<th style="width:130px">レーベル</th><th>備考</th></tr></thead><tbody>`;
                g.members.forEach(m => {
                    const positionDisplay = m.isLeader ? `Leader / ${m.pos}` : m.pos;
                    const memberImgHtml = (m.isFormer || !m.img) ? '<span class="text-gray-300">-</span>' : `<img src="${g.basePath + m.img}" class="member-img" onerror="this.src='https://placehold.jp/400x400.png?text=NO+IMG'">`;
                    html += `<tr><td class="text-center">${memberImgHtml}</td><td class="font-bold">${m.name}</td><td>${m.div}</td><td>${positionDisplay}</td>${g.members.some(m => m.subUnit && m.subUnit !== "-") ? `<td>${m.subUnit || '-'}</td>` : ''}<td class="logo-font" style="font-size:10px">${labels[m.label].name}</td><td>${m.remarks || '-'}</td></tr>`;
                });
                html += `</tbody></table></div></div></div>`;
                dArea.innerHTML += html;
            });

            Object.keys(specialProjects).forEach(pk => {
                const p = specialProjects[pk];
                tocProjects.innerHTML += `<li><a href="#proj-anchor-${pk}">- ${p.title}</a></li>`;
                if (pk === 'heaventeen') return;
                let html = `<div class="mb-4" id="proj-anchor-${pk}"><h3 onclick="toggleSection('proj-${pk}', 'btn-${pk}')" class="sub-header">${p.title} <span class="toggle-btn" id="btn-${pk}">表示</span></h3><div id="proj-${pk}" class="collapsible-content collapsed p-6 bg-gray-50 border border-gray-100 mt-2 mb-8"><p class="text-xs font-bold mb-3">"${p.tagline}"</p><p class="text-[12px] mb-6 leading-relaxed">${p.description}</p>`;
                p.teams.forEach(team => { html += `<div class="mb-4"><p class="text-[10px] font-bold border-b pb-1 mb-2 uppercase">${team.name}</p><p class="text-[11px] text-gray-600">${team.members.map(m => `${m.name} (${m.role})`).join(', ')}</p></div>`; });
                sArea.innerHTML += html + `</div></div>`;
            });

            const hvBody = document.getElementById('heaventeen-body');
            window.heaventeenResults.forEach(r => { hvBody.innerHTML += `<tr ${r.final === 99 ? 'style="color:#bbb"' : ''}><td>${r.name}</td><td>${r.rank0}位</td><td>${r.rank1===99?'脱落':r.rank1+'位'}</td><td>${r.rank2===99?'脱落':r.rank2+'位'}</td><td>${r.final===99?'-':r.final+'位'}</td><td>${r.result}</td></tr>`; });
        });
        function toggleSection(cId, bId) { const c = document.getElementById(cId); const b = document.getElementById(bId); if (!c || !b) return; c.classList.toggle('collapsed'); b.innerText = c.classList.contains('collapsed') ? "表示" : "非表示"; }
    </script>
</body>
</html>
