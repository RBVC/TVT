<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVT Wiki | 内部機密資料</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="group.js"></script>
    <style>
        body { background-color: #f6f6f6; color: #202122; font-family: 'Noto Sans JP', sans-serif; }
        .wiki-container { max-width: 1100px; margin: 100px auto; background: white; padding: 60px; border: 1px solid #a2a9b1; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        
        h1 { font-family: 'Rajdhani', sans-serif; font-size: 3rem; font-weight: 700; border-bottom: 1px solid #a2a9b1; margin-bottom: 2rem; }
        
        /* 🆕 セクションごとの大きな余白：非表示時でも隙間を保つ */
        section { margin-bottom: 5rem; }

        h2 { font-family: 'Rajdhani', sans-serif; font-size: 1.8rem; font-weight: 700; border-bottom: 1px solid #a2a9b1; margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between; cursor: pointer; padding-bottom: 10px; }
        h2::before { content: ""; display: inline-block; width: 8px; height: 1.8rem; background: #000; margin-right: 12px; }
        
        h3 { font-family: 'Rajdhani', sans-serif; font-size: 1.4rem; font-weight: 700; margin-top: 1rem; margin-bottom: 1rem; color: #000; display: flex; align-items: center; justify-content: space-between; cursor: pointer; background: #f8f9fa; padding: 12px; border: 1px solid #eee; }

        .toggle-btn { font-size: 0.75rem; color: #0645ad; font-weight: normal; }
        .toc-box { background: #f8f9fa; border: 1px solid #a2a9b1; padding: 25px; display: inline-block; min-width: 350px; margin-bottom: 4rem; font-size: 0.9rem; }
        .toc-title { font-weight: 900; text-align: center; margin-bottom: 15px; border-bottom: 1px solid #ccc; padding-bottom: 5px; }
        .toc-box ul { list-style: none; padding: 0; }
        .toc-box li { margin: 8px 0; }
        .toc-box a { color: #0645ad; text-decoration: none; }
        .toc-box a:hover { text-decoration: underline; }

        .table-wrapper { overflow-x: auto; margin-bottom: 2rem; border: 1px solid #a2a9b1; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { border: 1px solid #a2a9b1; padding: 12px; text-align: left; vertical-align: middle; }
        th { background-color: #eaecf0; font-weight: bold; cursor: pointer; }
        
        .matrix-table { table-layout: fixed; min-width: 1000px; }
        .matrix-table th, .matrix-table td { width: 14.28%; text-align: center; }
        .matrix-ceo { font-size: 0.7rem; color: #666; font-weight: 400; display: block; margin-top: 4px; border-top: 1px solid #ccc; padding-top: 4px; }
        .group-col { font-family: 'Rajdhani', sans-serif; font-weight: 800; background: #f8f9fa; text-align: left !important; width: 140px !important; }

        .detail-table { table-layout: fixed; min-width: 800px; }
        .detail-table th:nth-child(1) { width: 70px; }
        .detail-table th:nth-child(2) { width: 160px; }
        .detail-table th:nth-child(3) { width: 110px; }
        .detail-table th:nth-child(4) { width: 230px; }
        .detail-table th:nth-child(5) { width: 120px; }

        .member-img { width: 50px; height: 50px; object-fit: cover; background: #eee; border-radius: 2px; margin: 0 auto; }
        .collapsible-content.collapsed { display: none; }
        
        @media (max-width: 768px) {
            .wiki-container { padding: 20px; margin: 70px 10px; }
            h1 { font-size: 2rem; }
            .toc-box { width: 100%; min-width: 0; }
        }
    </style>
</head>
<body>
    <header><a href="index.html" class="logo">TVT</a><div class="menu-trigger" id="menu-btn"><span></span><span></span><span></span></div></header>
    <div class="nav-overlay" id="nav-menu"><a href="index.html#artists" class="menu-close">ARTISTS</a><a href="wiki.html" class="menu-close">WIKI</a></div>
    
    <main class="wiki-container">
        <h1>Teyvat Entertainment 内部機密資料</h1>
        
        <nav class="toc-box">
            <div class="toc-title">目次</div>
            <ul>
                <li>1. <a href="#sec-affiliates">所属アーティスト・マトリックス</a></li>
                <li>2. <a href="#sec-details">グループ詳細設定</a></li>
                <li>3. <a href="#sec-projects">プロジェクト一覧</a></li>
            </ul>
        </nav>

        <!-- Section 1: マトリックス -->
        <section id="sec-affiliates">
            <h2 onclick="toggleSection('matrix-content', 'matrix-btn')">所属アーティスト・マトリックス <span class="toggle-btn" id="matrix-btn">非表示</span></h2>
            <div class="collapsible-content" id="matrix-content">
                <div class="table-wrapper"><table class="matrix-table" id="matrix-table">
                    <thead><tr id="matrix-header"><th>グループ名</th></tr></thead>
                    <tbody id="matrix-body"></tbody>
                </table></div>
            </div>
        </section>

        <!-- Section 2: グループ詳細 -->
        <section id="sec-details">
            <h2 onclick="toggleSection('details-content', 'details-btn')">グループ詳細設定 <span class="toggle-btn" id="details-btn">非表示</span></h2>
            <div class="collapsible-content" id="details-content"></div>
        </section>

        <!-- Section 3: HEAVENTEEN -->
        <section id="sec-projects">
            <h2 onclick="toggleSection('projects-content', 'projects-btn')">プロジェクト一覧 <span class="toggle-btn" id="projects-btn">非表示</span></h2>
            <div class="collapsible-content" id="projects-content">
                <h3>HEAVENTEEN 全記録</h3>
                <div class="table-wrapper"><table id="heaventeenTable">
                    <thead><tr><th onclick="sortWiki(0,'heaventeenTable')">名前</th><th>0次</th><th>1次</th><th>2次</th><th>最終</th><th>結果</th></tr></thead>
                    <tbody id="heaventeen-body"></tbody>
                </table></div>
            </div>
        </section>
    </main>

    <script>
        // マトリックス生成
        const matrixHeader = document.getElementById('matrix-header');
        const matrixBody = document.getElementById('matrix-body');
        Object.keys(labels).forEach(k => {
            matrixHeader.innerHTML += `<th>${labels[k].name}<span class="matrix-ceo">${labels[k].ceo}</span></th>`;
        });
        Object.keys(allGroups).forEach(gK => {
            const g = allGroups[gK];
            let row = `<tr><td class="group-col">${g.name}</td>`;
            Object.keys(labels).forEach(lK => {
                const members = g.members.filter(m => m.label === lK && !m.isFormer).map(m => m.name).join(', ');
                row += `<td>${members || '-'}</td>`;
            });
            matrixBody.innerHTML += row + `</tr>`;
        });

        // 詳細表生成
        const detailArea = document.getElementById('details-content');
        Object.keys(allGroups).forEach(gK => {
            const g = allGroups[gK];
            let html = `<h3 onclick="toggleSection('det-${gK}', 'btn-${gK}')">${g.name} <span class="toggle-btn" id="btn-${gK}">表示</span></h3>
                <div id="det-${gK}" class="table-wrapper collapsible-content collapsed"><table class="detail-table">
                <thead><tr><th>画像</th><th>名前</th><th>出身</th><th>ポジション</th><th>レーベル</th></tr></thead><tbody>`;
            g.members.forEach(m => {
                html += `<tr ${m.isFormer ? 'style="color:#bbb"' : ''}>
                    <td class="text-center">${m.img ? `<img src="${m.img}" class="member-img">` : '-'}</td>
                    <td>${m.isLeader ? `<b>${m.name} (Leader)</b>` : m.name}${m.isFormer ? ' (元メンバー)' : ''}</td>
                    <td>${m.div}</td><td>${m.pos}</td><td class="logo-font">${labels[m.label].name}</td></tr>`;
            });
            detailArea.innerHTML += html + `</tbody></table></div>`;
        });

        // HEAVENTEEN生成
        const hvBody = document.getElementById('heaventeen-body');
        heaventeenResults.forEach(r => {
            hvBody.innerHTML += `<tr ${r.final === 99 ? 'style="color:#bbb"' : ''}>
                <td>${r.name}</td><td>${r.rank0}位</td><td>${r.rank1===99?'脱落':r.rank1+'位'}</td>
                <td>${r.rank2===99?'脱落':r.rank2+'位'}</td><td>${r.final===99?'-':r.final+'位'}</td><td>${r.result}</td></tr>`;
        });

        function toggleSection(cId, bId) { 
            const c = document.getElementById(cId); 
            const b = document.getElementById(bId); 
            c.classList.toggle('collapsed'); 
            b.innerText = c.classList.contains('collapsed') ? "表示" : "非表示"; 
        }
        const menuBtn = document.getElementById('menu-btn'); const navMenu = document.getElementById('nav-menu'); menuBtn.onclick = () => { menuBtn.classList.toggle('active'); navMenu.classList.toggle('open'); document.body.style.overflow = navMenu.classList.contains('open') ? 'hidden' : 'auto'; };
    </script>
</body>
</html>
