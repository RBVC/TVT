<!-- --- START OF FILE wiki.html --- -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVT Wiki | 内部機密資料</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="data/wiki.js"></script>
    <script src="data/matrix.js"></script>
    
    <!-- 💡 所属グループのJSを順番に読み込み -->
    <script src="data/group/gen1us.js"></script>
    <script src="data/group/4ggravate.js"></script>
    
    <script src="common.js"></script>
    
    <style>
        body { background-color: #ffffff; color: #000000; font-size: 14px; }
        .wiki-container { max-width: 1100px; margin: 0 auto; background: white; padding: 60px 40px; }
        h1 { font-family: 'Source Han Sans JP', sans-serif; font-size: 3rem; font-weight: 900; border-bottom: 2px solid #000; margin-bottom: 4rem; padding-bottom: 20px; }
        section { margin-bottom: 8rem; }
        h2 { font-family: 'Source Han Sans JP', sans-serif; font-size: 1.8rem; font-weight: 900; border-bottom: 1px solid #eee; margin-bottom: 3rem; display: flex; align-items: center; justify-content: space-between; cursor: pointer; padding-bottom: 15px; }
        h2::before { content: ""; display: inline-block; width: 8px; height: 1.8rem; background: #000; margin-right: 15px; }

        .table-wrapper { overflow-x: auto; margin-bottom: 2rem; border: 1px solid #f0f0f0; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 1000px; table-layout: fixed; }
        th, td { border: 1px solid #f0f0f0; padding: 15px; text-align: left; vertical-align: middle; line-height: 1.5; word-break: break-word; }
        th { background-color: #fafafa; font-weight: 900; color: #333; }
        
        .matrix-ceo { display: block; font-size: 11px; color: #999; font-weight: 400; margin-top: 5px; border-top: 1px solid #eee; padding-top: 5px; }
        .member-img { width: 60px; height: 60px; object-fit: cover; border: 1px solid #eee; display: block; margin: 0 auto; }
        
        .collapsible-content.collapsed { display: none; }
        .toggle-btn { font-size: 0.7rem; color: #999; font-weight: 700; border: 1px solid #eee; padding: 4px 10px; cursor: pointer; transition: 0.3s; }
        .toggle-btn:hover { background: #000; color: #fff; }

        .confidential-area { margin-top: 40px; border-top: 2px dashed #ffebeb; padding-top: 40px; }
        .confidential-box { background: #fffcfc; border: 1px solid #ffebeb; padding: 30px; }
        .conf-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .conf-label { color: #d32f2f; font-weight: 900; letter-spacing: 0.2em; font-size: 0.75rem; }
        .btn-unlock { background: #d32f2f; color: #fff; font-size: 0.7rem; padding: 5px 15px; font-weight: 900; cursor: pointer; }
    </style>
</head>
<body>
    <div id="common-header"></div>
    <main class="wiki-container">
        <div style="padding-top: 60px; margin-bottom: 60px;">
            <h1 class="bold-title">Teyvat Entertainment 内部機密資料</h1>
        </div>
        
        <section id="sec-affiliates">
            <h2 onclick="toggleSection('matrix-content', 'matrix-btn')">所属アーティスト・マトリックス <span class="toggle-btn" id="matrix-btn">非表示</span></h2>
            <div class="collapsible-content mt-12" id="matrix-content">
                <div class="table-wrapper">
                    <table class="matrix-table">
                        <thead id="matrix-header"><tr><th>グループ名</th></tr></thead>
                        <tbody id="matrix-body"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section id="sec-details">
            <h2 onclick="toggleSection('details-content', 'details-btn')">グループ詳細設定 <span class="toggle-btn" id="details-btn">非表示</span></h2>
            <div id="details-content" class="collapsible-content mt-12"></div>
        </section>
    </main>
    <div id="common-footer"></div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // マトリックス生成
            const mHead = document.getElementById('matrix-header').rows[0];
            const mBody = document.getElementById('matrix-body');
            Object.keys(labels).forEach(k => {
                const label = labels[k];
                mHead.innerHTML += `<th>${label.name}<span class="matrix-ceo">CEO: ${label.ceo}</span></th>`;
            });
            Object.keys(allGroups).forEach(gk => {
                const g = allGroups[gk];
                let row = `<tr><td class="font-bold">${g.name}</td>`;
                Object.keys(labels).forEach(lk => {
                    const mems = g.members.filter(m => m.label === lk && !m.isFormer).map(m => m.name).join('<br>');
                    row += `<td>${mems || '-'}</td>`;
                });
                mBody.innerHTML += row + '</tr>';
            });

            // グループ詳細生成
            const dArea = document.getElementById('details-content');
            Object.keys(allGroups).forEach(gk => {
                const g = allGroups[gk];
                let html = `
                <div class="mb-32">
                    <h3 onclick="toggleSection('det-${gk}', 'btn-${gk}')" style="font-size:2.2rem; font-weight:900; cursor:pointer; border-bottom:3px solid #000; padding:15px 0; display:flex; justify-content:space-between; align-items:center;">
                        ${g.name} <span class="toggle-btn" id="btn-${gk}">表示</span>
                    </h3>
                    <div id="det-${gk}" class="collapsible-content pt-10">
                        <p class="text-gray-700 mb-10 leading-relaxed">${g.description}</p>
                        
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th style="width:100px">画像</th>
                                        <th style="width:160px">名前</th>
                                        <th style="width:230px">ポジション</th>
                                        <th style="width:160px">所属ユニット</th>
                                        <th style="width:150px">レーベル</th>
                                        <th>備考</th>
                                    </tr>
                                </thead>
                                <tbody>`;
                                
                g.members.forEach(m => {
                    const positionDisplay = m.isLeader ? `Leader / ${m.pos}` : m.pos;
                    html += `
                        <tr ${m.isFormer ? 'style="color:#bbb"' : ''}>
                            <td class="text-center">
                                <img src="${g.basePath + (m.img || '')}" class="member-img" onerror="this.src='https://placehold.jp/400x400.png?text=NO+IMG'">
                            </td>
                            <td class="font-bold">${m.name}${m.isFormer ? ' <span class="text-[10px] font-normal">(Former)</span>' : ''}</td>
                            <td>${positionDisplay}</td>
                            <td class="font-bold">${m.subUnit || '-'}</td>
                            <td class="logo-font" style="font-size:10px">${labels[m.label].name}</td>
                            <td style="font-size:11px">${m.remarks || '-'}</td>
                        </tr>`;
                });
                
                html += `</tbody></table></div>`;

                if (g.confidential) {
                    const conf = g.confidential;
                    html += `
                    <div class="confidential-area">
                        <div class="confidential-box">
                            <div class="conf-header">
                                <span class="conf-label">ACCESS RESTRICTED: 内部機密資料</span>
                                <div class="btn-unlock" onclick="toggleSection('conf-body-${gk}', 'btn-unlock-${gk}')" id="btn-unlock-${gk}">閲覧許可</div>
                            </div>
                            <div id="conf-body-${gk}" class="collapsible-content collapsed pt-6 border-t border-red-50">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
                                    <div class="text-[12px]">
                                        <p class="font-bold mb-3 border-b border-red-100 pb-1">【年齢階層】</p>
                                        <ul class="space-y-2 mb-8 text-gray-600">
                                            ${conf.ageTeams.map(t => `<li><b class="text-black">${t.name}:</b> ${t.members}</li>`).join('')}
                                        </ul>
                                        <p class="font-bold mb-3 border-b border-red-100 pb-1">【公式カップリング】</p>
                                        <p class="text-gray-500">${conf.couplings.join(' / ')}</p>
                                    </div>
                                    <div class="text-[12px]">
                                        <p class="font-bold mb-3 border-b border-red-100 pb-1">【ポジション比率】</p>
                                        <div class="space-y-4 text-gray-500 leading-loose">
                                            <p><b class="text-black block mb-1">VOCAL</b> ${conf.ratios.vocal}</p>
                                            <p><b class="text-black block mb-1">RAP</b> ${conf.ratios.rap}</p>
                                            <p><b class="text-black block mb-1">DANCE</b> ${conf.ratios.dance}</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>`;
                }
                html += `</div></div>`;
                dArea.innerHTML += html;
            });
        });

        function toggleSection(cId, bId) {
            const c = document.getElementById(cId);
            const b = document.getElementById(bId);
            if (!c || !b) return;
            c.classList.toggle('collapsed');
            const isUnlockBtn = b.classList.contains('btn-unlock');
            if (isUnlockBtn) {
                b.innerText = c.classList.contains('collapsed') ? "閲覧許可" : "非表示";
            } else {
                b.innerText = c.classList.contains('collapsed') ? "表示" : "非表示";
            }
        }
    </script>
</body>
</html>
