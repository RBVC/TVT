<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVT Wiki | 内部機密アーカイブ</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="group.js"></script>
    <style>
        body { background-color: #f6f6f6; color: #202122; font-family: 'Noto Sans JP', sans-serif; }
        .wiki-container { max-width: 1100px; margin: 100px auto; background: white; padding: 40px; border: 1px solid #a2a9b1; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        h1 { font-family: 'Rajdhani', sans-serif; font-size: 3rem; font-weight: 700; border-bottom: 1px solid #a2a9b1; margin-bottom: 1rem; }
        h2 { font-family: 'Rajdhani', sans-serif; font-size: 1.8rem; font-weight: 700; border-bottom: 1px solid #a2a9b1; margin-top: 3rem; margin-bottom: 1rem; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
        h2::before { content: ""; display: inline-block; width: 8px; height: 1.8rem; background: #000; margin-right: 12px; }
        h3 { font-family: 'Rajdhani', sans-serif; font-size: 1.4rem; font-weight: 700; margin-top: 2rem; margin-bottom: 0.5rem; display: flex; align-items: center; justify-content: space-between; cursor: pointer; background: #f8f9fa; padding: 10px; border: 1px solid #eee; }
        .toggle-btn { font-size: 0.8rem; color: #0645ad; font-weight: normal; }
        .table-wrapper { overflow-x: auto; margin-bottom: 2rem; border: 1px solid #a2a9b1; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { border: 1px solid #a2a9b1; padding: 10px; text-align: left; vertical-align: middle; }
        th { background-color: #eaecf0; font-weight: bold; cursor: pointer; }
        .matrix-table { table-layout: fixed; min-width: 900px; }
        .matrix-table th, .matrix-table td { width: 16.66%; text-align: center; }
        .detail-table { table-layout: fixed; min-width: 800px; }
        .detail-table th:nth-child(1) { width: 70px; }
        .detail-table th:nth-child(2) { width: 160px; }
        .detail-table th:nth-child(3) { width: 110px; }
        .detail-table th:nth-child(4) { width: 230px; }
        .member-img { width: 50px; height: 50px; object-fit: cover; background: #eee; border-radius: 2px; }
        .collapsible-content.collapsed { display: none; }
    </style>
</head>
<body>
    <header><a href="index.html" class="logo">TVT</a><div class="menu-trigger" id="menu-btn"><span></span><span></span><span></span></div></header>
    <div class="nav-overlay" id="nav-menu"><a href="index.html#artists" class="menu-close">ARTISTS</a><a href="wiki.html" class="menu-close">WIKI</a></div>
    
    <main class="wiki-container">
        <h1>Teyvat Entertainment 内部機密資料</h1>
        
        <!-- 所属マトリックス -->
        <section id="sec-affiliates">
            <h2 onclick="toggleSection('matrix-content', 'matrix-btn')">所属アーティスト・マトリックス <span class="toggle-btn" id="matrix-btn">非表示</span></h2>
            <div class="collapsible-content" id="matrix-content">
                <div class="table-wrapper"><table class="matrix-table" id="matrix-table">
                    <thead>
                        <tr id="matrix-header-labels"><th>グループ名</th></tr>
                        <tr id="matrix-header-ceos"><th></th></tr>
                    </thead>
                    <tbody id="matrix-body"></tbody>
                </table></div>
            </div>
        </section>

        <!-- グループ詳細 -->
        <section id="sec-details">
            <h2 onclick="toggleSection('details-content', 'details-btn')">グループ詳細設定 <span class="toggle-btn" id="details-btn">非表示</span></h2>
            <div class="collapsible-content" id="details-content" id="groups-detail-area">
                <!-- JSで自動生成 -->
            </div>
        </section>

        <!-- HEAVENTEEN -->
        <section id="sec-projects">
            <h2 onclick="toggleSection('projects-content', 'projects-btn')">プロジェクト一覧 <span class="toggle-btn" id="projects-btn">非表示</span></h2>
            <div class="collapsible-content" id="projects-content">
                <div class="table-wrapper"><table id="heaventeenTable">
                    <thead><tr><th onclick="sortWiki(0,'heaventeenTable')">名前</th><th>0次</th><th>1次</th><th>2次</th><th>最終</th><th>結果</th></tr></thead>
                    <tbody id="heaventeen-body"></tbody>
                </table></div>
            </div>
        </section>
    </main>

    <script>
        // 1. マトリックス表の生成
        const matrixHeaderLabels = document.getElementById('matrix-header-labels');
        const matrixHeaderCeos = document.getElementById('matrix-header-ceos');
        const matrixBody = document.getElementById('matrix-body');
        
        Object.keys(labels).forEach(key => {
            matrixHeaderLabels.innerHTML += `<th class="logo-font" style="font-size:0.8rem">${labels[key].name}</th>`;
            matrixHeaderCeos.innerHTML += `<th style="font-size:0.7rem; color:#666; font-weight:400">${labels[key].ceo}</th>`;
        });

        Object.keys(allGroups).forEach(gKey => {
            const group = allGroups[gKey];
            let row = `<tr><td class="font-bold logo-font" style="background:#f8f9fa">${group.name}</td>`;
            Object.keys(labels).forEach(lKey => {
                const membersInLabel = group.members.filter(m => m.label === lKey && !m.isFormer).map(m => m.name).join(', ');
                row += `<td>${membersInLabel || '-'}</td>`;
            });
            row += `</tr>`;
            matrixBody.innerHTML += row;
        });

        // 2. 詳細表の生成
        const detailArea = document.getElementById('details-content');
        Object.keys(allGroups).forEach(gKey => {
            const group = allGroups[gKey];
            let section = `
                <h3 onclick="toggleSection('det-${gKey}', 'btn-${gKey}')">${group.name} <span class="toggle-btn" id="btn-${gKey}">表示</span></h3>
                <div id="det-${gKey}" class="table-wrapper collapsible-content collapsed">
                    <table class="detail-table">
                        <thead><tr><th>画像</th><th>名前</th><th>出身</th><th>ポジション</th><th>レーベル</th></tr></thead>
                        <tbody>`;
            group.members.forEach(m => {
                const nameDisplay = m.isLeader ? `<span class="font-bold">${m.name} (Leader)</span>` : m.name;
                const rowStyle = m.isFormer ? `style="color:#bbb"` : '';
                const formerTag = m.isFormer ? ` (元メンバー)` : '';
                section += `
                    <tr ${rowStyle}>
                        <td class="text-center">${m.img ? `<img src="${m.img}" class="member-img">` : '-'}</td>
                        <td>${nameDisplay}${formerTag}</td>
                        <td>${m.div}</td>
                        <td>${m.pos}</td>
                        <td class="logo-font">${m.label}</td>
                    </tr>`;
            });
            section += `</tbody></table></div>`;
            detailArea.innerHTML += section;
        });

        // 3. HEAVENTEEN表の生成
        const hvBody = document.getElementById('heaventeen-body');
        heaventeenResults.forEach(r => {
            const rowStyle = r.final === 99 ? `style="color:#bbb"` : '';
            hvBody.innerHTML += `
                <tr ${rowStyle}>
                    <td>${r.name}</td>
                    <td data-val="${r.rank0}">${r.rank0}位</td>
                    <td data-val="${r.rank1}">${r.rank1 === 99 ? '脱落' : r.rank1 + '位'}</td>
                    <td data-val="${r.rank2}">${r.rank2 === 99 ? '脱落' : r.rank2 + '位'}</td>
                    <td data-val="${r.final}">${r.final === 99 ? '-' : r.final + '位'}</td>
                    <td>${r.result}</td>
                </tr>`;
        });

        function toggleSection(cId, bId) { const c = document.getElementById(cId); const b = document.getElementById(bId); if (c.classList.contains('collapsed')) { c.classList.remove('collapsed'); b.innerText = "非表示"; } else { c.classList.add('collapsed'); b.innerText = "表示"; } }
        function sortWiki(n, tId) { /* 前回のソートロジック */ }
        const menuBtn = document.getElementById('menu-btn'); const navMenu = document.getElementById('nav-menu'); menuBtn.onclick = () => { menuBtn.classList.toggle('active'); navMenu.classList.toggle('open'); document.body.style.overflow = navMenu.classList.contains('open') ? 'hidden' : 'auto'; };
    </script>
</body>
</html>
