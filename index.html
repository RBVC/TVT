<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teyvat Entertainment | Official</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="group.js"></script>
    <script src="project.js"></script>
    <script src="common.js"></script>
    <style>
        .main-visual-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px; width: 100vw; margin-left: calc(50% - 50vw); background-color: #fff; }
        .artist-box { position: relative; width: 100%; aspect-ratio: 3 / 1; overflow: hidden; background-color: #000; }
        .artist-box img { width: 100%; height: 100%; object-fit: cover; transition: 1.2s; }
        .artist-box:hover img { transform: scale(1.05); }
        .artist-hover { position: absolute; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.5s; z-index: 10; }
        .artist-box:hover .artist-hover { opacity: 1; }
        @media (max-width: 768px) { .main-visual-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div id="common-header"></div>
    <main>
        <!-- 💡 修正：Artists見出し。余白を詰め、IDを設定 -->
        <section id="artists-section" class="max-w-6xl mx-auto px-6 pt-12 pb-8">
            <h2 class="logo-font text-5xl border-b-2 border-black pb-6 bold-title">Artists</h2>
        </section>

        <section id="artists" class="main-visual-grid">
            <script>
                document.write(Object.keys(allGroups).map(id => {
                    const g = allGroups[id];
                    if (!g.banner) return '';
                    return `<a href="artist.html?id=${id}" class="artist-box"><img src="${g.basePath + g.banner}"><div class="artist-hover"><span class="logo-font text-white text-4xl md:text-6xl tracking-widest">${g.name}</span></div></a>`;
                }).join(''));
            </script>
        </section>

        <section id="latest-news" class="max-w-6xl mx-auto px-6 py-32">
            <h2 class="logo-font text-5xl border-b-2 border-black pb-8 mb-16 bold-title">Latest News</h2>
            <div id="latest-news-list" class="grid grid-cols-1 md:grid-cols-2 gap-16"></div>
        </section>
    </main>
    <div id="common-footer"></div>
</body>
</html>
