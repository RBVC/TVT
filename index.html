<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teyvat Entertainment | Official</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .main-visual-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2px;
            width: 100vw;
            margin-left: calc(50% - 50vw);
            background-color: #fff;
        }
        .artist-box {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 1; 
            overflow: hidden;
            background-color: #000;
        }
        .artist-box img {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            display: block;
            transition: transform 1.2s cubic-bezier(0.2, 1, 0.3, 1);
        }
        .artist-box:hover img { transform: scale(1.05); }
        .artist-hover {
            position: absolute;
            inset: 0;
            background-color: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 10;
        }
        .artist-box:hover .artist-hover { opacity: 1; }
        @media (max-width: 768px) {
            .main-visual-grid { grid-template-columns: 1fr; }
            .artist-box { aspect-ratio: 3 / 1; }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">TVT</a>
        <div class="menu-trigger" id="menu-btn">
            <span></span><span></span><span></span>
        </div>
    </header>
    <div class="nav-overlay" id="nav-menu">
        <a href="index.html#artists" class="menu-close">ARTISTS</a>
        <a href="wiki.html" class="menu-close">WIKI</a>
    </div>
    <main class="pt-[73px]">
        <section id="artists" class="main-visual-grid">
            <a href="artist.html?id=gen1us" class="artist-box">
                <img src="images/gen1us/masquerade-gen1us.jpg" alt="GEN1US">
                <div class="artist-hover"><span class="logo-font text-white text-4xl md:text-6xl tracking-widest">GEN1US</span></div>
            </a>
            <a href="artist.html?id=4ggravate" class="artist-box">
                <img src="images/4ggravate/4ggravate.jpg" alt="4ggravate">
                <div class="artist-hover"><span class="logo-font text-white text-4xl md:text-6xl tracking-widest">4ggravate</span></div>
            </a>
            <a href="artist.html?id=6reeze" class="artist-box">
                <img src="images/6reeze/6reeze.jpg" alt="6reeze">
                <div class="artist-hover"><span class="logo-font text-white text-4xl md:text-6xl tracking-widest">6reeze</span></div>
            </a>
            <a href="artist.html?id=universe" class="artist-box">
                <img src="images/universe/tvt-u.jpg" alt="TVT U">
                <div class="artist-hover"><span class="logo-font text-white text-4xl md:text-6xl tracking-widest">TVT U</span></div>
            </a>
        </section>
        <section class="max-w-6xl mx-auto px-6 py-24">
            <div class="flex justify-between items-end mb-12 border-b-2 border-black pb-8">
                <h2 class="logo-font text-5xl uppercase">Latest News</h2>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-16 text-left">
                <div class="group cursor-pointer">
                    <p class="text-[10px] text-gray-400 mb-4 uppercase tracking-[0.4em]">Project / 202X.XX.XX</p>
                    <h3 class="text-2xl font-bold mb-6">【妄想】スペシャルコラボユニット始動？</h3>
                    <div class="aspect-video bg-gray-50 flex items-center justify-center text-gray-200 logo-font text-3xl">COMING SOON</div>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <div class="f-logo">TVT</div>
        <p>&copy; Teyvat Entertainment All Rights Reserved.</p>
    </footer>
    <script>
        const menuBtn = document.getElementById('menu-btn');
        const navMenu = document.getElementById('nav-menu');
        const menuLinks = document.querySelectorAll('.menu-close');
        menuBtn.onclick = () => { menuBtn.classList.toggle('active'); navMenu.classList.toggle('open'); document.body.style.overflow = navMenu.classList.contains('open') ? 'hidden' : 'auto'; };
        menuLinks.forEach(link => { link.onclick = () => { menuBtn.classList.remove('active'); navMenu.classList.remove('open'); document.body.style.overflow = 'auto'; }; });
    </script>
</body>
</html>
