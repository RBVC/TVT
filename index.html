<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teyvat Entertainment | Official</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <!-- Hamburger Header -->
    <header>
        <a href="index.html" class="logo">TVT</a>
        <div class="menu-trigger" id="menu-btn">
            <span></span><span></span><span></span>
        </div>
    </header>

    <!-- Nav Overlay -->
    <div class="nav-overlay" id="nav-menu">
        <a href="index.html#artists" class="menu-close">ARTISTS</a>
        <a href="wiki.html" class="menu-close">WIKI</a>
    </div>

    <main class="pt-0">
        <!-- Main Banner -->
        <section class="relative w-full h-[80vh] bg-black overflow-hidden">
            <img src="images/gen1us/masquerade-gen1us.jpg" class="w-full h-full object-cover opacity-60">
            <div class="absolute inset-0 bg-gradient-to-t from-black via-black/30 to-transparent"></div>
            <div class="absolute bottom-16 left-8 md:left-20">
                <p class="logo-font text-white/60 text-xl tracking-[0.4em] mb-4 uppercase">GEN1US</p>
                <h2 class="logo-font text-6xl md:text-[9rem] leading-[0.8] tracking-tighter text-white">MASQUERADE</h2>
            </div>
        </section>

        <!-- Artists Grid: スマホでのレイアウトを1列〜2列に自動調整 -->
        <section id="artists" class="grid grid-cols-2 lg:grid-cols-4 gap-px bg-gray-100 border-y border-gray-100">
            <!-- GEN1US -->
            <a href="artist.html?id=gen1us" class="relative aspect-[4/5] md:aspect-[16/10] bg-white group overflow-hidden">
                <img src="images/gen1us/masquerade-gen1us.jpg" class="w-full h-full object-cover transition duration-700">
                <div class="absolute inset-0 bg-black opacity-0 group-hover:opacity-100 transition-opacity duration-500 flex items-center justify-center">
                    <span class="logo-font text-white text-3xl">GEN1US</span>
                </div>
            </a>
            <!-- 4ggravate (見切れないよう配置修正) -->
            <a href="artist.html?id=4ggravate" class="relative aspect-[4/5] md:aspect-[16/10] bg-white group overflow-hidden">
                <img src="images/4ggravate/4ggravate.jpg" class="w-full h-full object-cover transition duration-700" style="object-position: center 20%;">
                <div class="absolute inset-0 bg-black opacity-0 group-hover:opacity-100 transition-opacity duration-500 flex items-center justify-center">
                    <span class="logo-font text-white text-3xl">4ggravate</span>
                </div>
            </a>
            <!-- 6reeze -->
            <a href="artist.html?id=6reeze" class="relative aspect-[4/5] md:aspect-[16/10] bg-white group overflow-hidden flex items-center justify-center">
                <span class="logo-font text-gray-200 text-3xl">6reeze</span>
                <div class="absolute inset-0 bg-black opacity-0 group-hover:opacity-100 transition-opacity duration-500 flex items-center justify-center">
                    <span class="logo-font text-white text-3xl">6reeze</span>
                </div>
            </a>
            <!-- Coming Soon -->
            <div class="aspect-[4/5] md:aspect-[16/10] bg-white flex items-center justify-center">
                <span class="logo-font text-gray-200 text-lg uppercase">Coming Soon</span>
            </div>
        </section>

        <!-- LATEST NEWS -->
        <section class="max-w-6xl mx-auto px-6 py-24">
            <div class="flex justify-between items-end mb-12 border-b-2 border-black pb-8">
                <h2 class="logo-font text-4xl uppercase">Latest News</h2>
                <a href="#" class="text-[10px] font-bold tracking-[0.3em] hover:underline">VIEW ALL</a>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
                <div class="group cursor-pointer">
                    <p class="text-[10px] text-gray-400 mb-4 uppercase tracking-[0.4em]">Project / 202X.XX.XX</p>
                    <h3 class="text-xl font-bold mb-6">【妄想】スペシャルコラボユニット始動？</h3>
                    <div class="aspect-video bg-gray-50 flex items-center justify-center text-gray-200 logo-font text-3xl uppercase">Coming Soon</div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="f-logo">TVT</div>
        <p>&copy; Teyvat Entertainment All Rights Reserved.</p>
    </footer>

    <script>
        const menuBtn = document.getElementById('menu-btn');
        const navMenu = document.getElementById('nav-menu');
        const menuLinks = document.querySelectorAll('.menu-close');

        menuBtn.onclick = () => {
            navMenu.classList.toggle('open');
            menuBtn.classList.toggle('active');
        };
        menuLinks.forEach(link => {
            link.onclick = () => {
                navMenu.classList.remove('open');
                menuBtn.classList.remove('active');
            };
        });
    </script>
</body>
</html>
