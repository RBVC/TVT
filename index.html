<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teyvat Entertainment | Official</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 🆕 YGスタイルの動的グリッド：全幅対応 */
        .yg-visual-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr; /* 左右で比率を変えてリズムを出す */
            gap: 4px; /* 極細のライン */
            width: 100%;
            background-color: #fff;
        }
        
        .yg-grid-item {
            position: relative;
            overflow: hidden;
            background-color: #f9f9f9;
        }

        /* 縦横比の調整：スクショ5枚目の雰囲気を再現 */
        .height-large { height: 70vh; }
        .height-medium { height: 50vh; }

        .yg-grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s cubic-bezier(0.2, 1, 0.3, 1);
        }

        .yg-grid-item:hover img {
            transform: scale(1.05);
        }

        /* ホバー時のテキストオーバーレイ */
        .hover-mask {
            position: absolute;
            inset: 0;
            background-color: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .yg-grid-item:hover .hover-mask {
            opacity: 1;
        }

        /* スマホ版：1列で全画面幅に */
        @media (max-width: 768px) {
            .yg-visual-grid {
                grid-template-columns: 1fr;
            }
            .height-large, .height-medium {
                height: 50vh; /* スマホでは高さを統一して見やすく */
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">TVT</a>
        <div class="menu-trigger" id="menu-btn">
            <span></span><span></span><span></span>
        </div>
    </header>

    <div class="nav-overlay" id="nav-menu">
        <a href="index.html#artists" class="menu-close">ARTISTS</a>
        <a href="wiki.html" class="menu-close">WIKI</a>
    </div>

    <main class="pt-[73px]"> <!-- ヘッダーの高さ分だけ空ける -->
        
        <!-- 🆕 アーティスト・メイン・グリッド -->
        <section id="artists" class="yg-visual-grid">
            
            <!-- 1. GEN1US (Top Left - Large) -->
            <a href="artist.html?id=gen1us" class="yg-grid-item height-large">
                <img src="images/gen1us/masquerade-gen1us.jpg" alt="GEN1US">
                <div class="hover-mask">
                    <span class="logo-font text-white text-5xl tracking-widest">GEN1US</span>
                </div>
            </a>

            <!-- 2. 4ggravate (Top Right - Large) -->
            <a href="artist.html?id=4ggravate" class="yg-grid-item height-large">
                <img src="images/4ggravate/4ggravate.jpg" alt="4ggravate" style="object-position: center 20%;">
                <div class="hover-mask">
                    <span class="logo-font text-white text-5xl tracking-widest">4ggravate</span>
                </div>
            </a>

            <!-- 3. 6reeze (Bottom Left - Medium) -->
            <a href="artist.html?id=6reeze" class="yg-grid-item height-medium">
                <img src="images/6reeze/6reeze.jpg" alt="6reeze">
                <div class="hover-mask">
                    <span class="logo-font text-white text-5xl tracking-widest">6reeze</span>
                </div>
            </a>

            <!-- 4. TVT U (Bottom Right - Medium) -->
            <a href="artist.html?id=universe" class="yg-grid-item height-medium">
                <img src="images/universe/tvt-u.jpg" alt="TVT U">
                <div class="hover-mask">
                    <span class="logo-font text-white text-5xl tracking-widest">TVT U</span>
                </div>
            </a>

        </section>

        <!-- LATEST NEWS -->
        <section class="max-w-6xl mx-auto px-6 py-24">
            <div class="flex justify-between items-end mb-12 border-b-2 border-black pb-8">
                <h2 class="logo-font text-4xl uppercase">Latest News</h2>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
                <div class="group cursor-pointer">
                    <p class="text-[10px] text-gray-400 mb-4 uppercase tracking-[0.4em]">Project / 202X.XX.XX</p>
                    <h3 class="text-xl font-bold mb-6">【妄想】スペシャルコラボユニット始動？</h3>
                    <div class="aspect-video bg-gray-50 flex items-center justify-center text-gray-200 logo-font text-3xl uppercase">Coming Soon</div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="f-logo">TVT</div>
        <p>&copy; Teyvat Entertainment All Rights Reserved.</p>
    </footer>

    <script>
        const menuBtn = document.getElementById('menu-btn');
        const navMenu = document.getElementById('nav-menu');
        const menuLinks = document.querySelectorAll('.menu-close');

        menuBtn.onclick = () => {
            menuBtn.classList.toggle('active');
            navMenu.classList.toggle('open');
            document.body.style.overflow = navMenu.classList.contains('open') ? 'hidden' : 'auto';
        };
        menuLinks.forEach(link => {
            link.onclick = () => {
                menuBtn.classList.remove('active');
                navMenu.classList.remove('open');
                document.body.style.overflow = 'auto';
            };
        });
    </script>
</body>
</html>
