<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teyvat Entertainment | Official Site</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@400;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000; color: #fff; font-family: 'Noto Sans JP', sans-serif; overflow-x: hidden; }
        .logo-font { font-family: 'Anton', sans-serif; letter-spacing: 0.1em; }
        
        /* ヒーローセクションのフェードアニメーション */
        .hero-overlay { background: linear-gradient(0deg, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 50%); }
        
        /* ホバー時のズーム効果 */
        .artist-card img { transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1); }
        .artist-card:hover img { transform: scale(1.1); }
        
        /* スクロールバーのカスタマイズ */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="fixed w-full z-50 flex justify-between items-center px-10 py-6 bg-black/50 backdrop-blur-md">
        <div class="text-3xl logo-font">TVT</div>
        <div class="hidden md:flex space-x-10 text-sm font-bold tracking-widest">
            <a href="#" class="hover:text-gray-400">ARTISTS</a>
            <a href="#" class="hover:text-gray-400">NEWS</a>
            <a href="./wiki.html" class="hover:text-gray-400 text-yellow-500">WIKI (Internal)</a>
        </div>
        <div class="md:hidden text-2xl">≡</div>
    </nav>

    <!-- Main Visual -->
    <section class="relative h-screen flex items-end justify-center overflow-hidden">
        <!-- ここにGEN1USの集合写真などを入れる想定 -->
        <div class="absolute inset-0 bg-gray-900 flex items-center justify-center">
            <p class="logo-font text-6xl md:text-9xl text-white/10 select-none">GEN1US COMING SOON</p>
        </div>
        <div class="hero-overlay absolute inset-0"></div>
        
        <div class="relative z-10 text-center pb-20">
            <h2 class="text-5xl md:text-8xl font-black mb-4 italic tracking-tighter">THE NEW STANDARD</h2>
            <p class="text-lg md:text-2xl tracking-[0.5em] font-light">TEYVAT ENTERTAINMENT</p>
        </div>
    </section>

    <!-- Artists Grid -->
    <section class="px-5 py-20 bg-black">
        <h3 class="logo-font text-4xl mb-10 ml-5 border-l-4 border-white pl-4">ARTISTS</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            
            <!-- Group 1: GEN1US -->
            <div class="artist-card relative aspect-[3/4] overflow-hidden bg-zinc-900 group cursor-pointer">
                <div class="absolute inset-0 flex items-center justify-center text-zinc-700 logo-font text-4xl">GEN1US</div>
                <!-- <img src="URL" class="absolute inset-0 w-full h-full object-cover"> -->
                <div class="absolute inset-0 bg-black/40 group-hover:bg-black/10 transition-colors"></div>
                <div class="absolute bottom-6 left-6">
                    <p class="text-2xl font-black italic">GEN1US</p>
                    <p class="text-xs tracking-widest opacity-70">SUPER UNIT</p>
                </div>
            </div>

            <!-- Group 2: 4ggravate -->
            <div class="artist-card relative aspect-[3/4] overflow-hidden bg-zinc-800 group cursor-pointer">
                <div class="absolute inset-0 flex items-center justify-center text-zinc-700 logo-font text-4xl">4ggravate</div>
                <div class="absolute bottom-6 left-6">
                    <p class="text-2xl font-black italic">4ggravate</p>
                    <p class="text-xs tracking-widest opacity-70">HIPHOP / RAP</p>
                </div>
            </div>

            <!-- Group 3: 6reeze -->
            <div class="artist-card relative aspect-[3/4] overflow-hidden bg-zinc-900 group cursor-pointer">
                <div class="absolute inset-0 flex items-center justify-center text-zinc-700 logo-font text-4xl">6reeze</div>
                <div class="absolute bottom-6 left-6">
                    <p class="text-2xl font-black italic">6reeze</p>
                    <p class="text-xs tracking-widest opacity-70">POP / DANCE</p>
                </div>
            </div>

            <!-- Group 4: TVT U -->
            <div class="artist-card relative aspect-[3/4] overflow-hidden bg-zinc-800 group cursor-pointer">
                <div class="absolute inset-0 flex items-center justify-center text-zinc-700 logo-font text-4xl">TVT U</div>
                <div class="absolute bottom-6 left-6">
                    <p class="text-2xl font-black italic">TVT U</p>
                    <p class="text-xs tracking-widest opacity-70">TE JUNIOR</p>
                </div>
            </div>

        </div>
    </section>

    <!-- Footer -->
    <footer class="py-10 text-center border-t border-zinc-800 text-zinc-500 text-xs">
        <p class="logo-font text-xl mb-4 text-white">TVT</p>
        <p>&copy; TEYVAT ENTERTAINMENT ALL RIGHTS RESERVED.</p>
    </footer>

</body>
</html>
