<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teyvat Entertainment | Official</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@400;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #fff; color: #000; font-family: 'Noto Sans JP', sans-serif; }
        .logo-font { font-family: 'Anton', sans-serif; letter-spacing: 0.1em; }
        .visual-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; background: #fff; }
        .grid-item { position: relative; aspect-ratio: 16/9; overflow: hidden; background: #f3f3f3; border: 1px solid #eee; }
        .grid-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.8s; }
        .grid-item:hover img { transform: scale(1.05); }
        .main-banner { position: relative; width: 100%; height: 75vh; background: #f9f9f9; overflow: hidden; }
        .banner-img { width: 100%; height: 100%; object-fit: cover; }
        .banner-overlay { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(255,255,255,1) 0%, rgba(255,255,255,0) 50%); }
    </style>
</head>
<body>
    <header class="fixed w-full z-50 bg-white/90 backdrop-blur-md border-b border-gray-100">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="text-3xl logo-font text-black">TVT</div>
            <nav class="hidden md:flex space-x-12 text-[11px] font-black tracking-[0.3em] text-gray-400">
                <a href="#" class="hover:text-black transition">ABOUT</a>
                <a href="gen1us.html" class="text-black uppercase">ARTISTS</a>
                <a href="./wiki.html" class="hover:text-black uppercase">WIKI</a>
            </nav>
            <div class="text-[10px] font-bold text-gray-400 uppercase">JP</div>
        </div>
    </header>

    <main class="pt-20">
        <section class="main-banner">
            <!-- 修正パス -->
            <img src="images/gen1us/masquerade-gen1us.jpg" class="banner-img">
            <div class="banner-overlay"></div>
            <div class="absolute bottom-10 left-10">
                <p class="logo-font text-gray-400 text-xl mb-2">GEN1US</p>
                <h2 class="logo-font text-7xl md:text-9xl italic leading-none tracking-tighter">MASQUERADE</h2>
            </div>
        </section>

        <section class="visual-grid">
            <a href="gen1us.html" class="grid-item group">
                <img src="images/gen1us/masquerade-gen1us.jpg">
                <div class="absolute bottom-6 left-6 logo-font text-2xl border-b-2 border-black pb-1">GEN1US</div>
            </a>
            <div class="grid-item flex items-center justify-center text-gray-300 logo-font text-4xl italic">4ggravate</div>
            <div class="grid-item flex items-center justify-center text-gray-300 logo-font text-4xl italic">6reeze</div>
            <div class="grid-item flex items-center justify-center text-gray-200 logo-font text-xl uppercase">Coming Soon</div>
        </section>
    </main>

    <footer class="py-20 text-center text-gray-300 text-[10px] tracking-widest">
        &copy; TEYVAT ENTERTAINMENT ALL RIGHTS RESERVED.
    </footer>
</body>
</html>
