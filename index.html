<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teyvat Entertainment | Official</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .text-shadow-premium { text-shadow: 0 0 20px rgba(255,255,255,0.3); }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo logo-font">TVT</a>
        <nav>
            <a href="index.html#artists" class="active">ARTISTS</a>
            <a href="wiki.html">WIKI</a>
        </nav>
        <div class="text-[10px] font-bold text-gray-400 uppercase">JP</div>
    </header>

    <main class="pt-0">
        <!-- Main Banner -->
        <section class="relative w-full h-[85vh] bg-black overflow-hidden">
            <img src="images/gen1us/masquerade-gen1us.jpg" class="w-full h-full object-cover opacity-70">
            <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>
            <div class="absolute bottom-20 left-10 md:left-20 z-10">
                <p class="logo-font text-white/70 text-xl tracking-[0.4em] mb-4 uppercase">GEN1US</p>
                <h2 class="logo-font text-7xl md:text-[10rem] leading-[0.8] tracking-tighter text-white">MASQUERADE</h2>
            </div>
        </section>

        <!-- Artists Grid -->
        <section id="artists" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-px bg-gray-100 border-y border-gray-100">
            
            <!-- GEN1US -->
            <a href="artist.html?id=gen1us" class="relative aspect-[16/10] bg-white group overflow-hidden">
                <img src="images/gen1us/masquerade-gen1us.jpg" class="w-full h-full object-cover transition duration-700">
                <div class="absolute inset-0 bg-black opacity-0 group-hover:opacity-100 transition-opacity duration-500 flex items-center justify-center">
                    <span class="logo-font text-white text-3xl tracking-widest">GEN1US</span>
                </div>
            </a>

            <!-- 4ggravate -->
            <a href="artist.html?id=4ggravate" class="relative aspect-[16/10] bg-white group overflow-hidden flex items-center justify-center">
                <img src="images/4ggravate/4ggravate.jpg" class="w-full h-full object-cover transition duration-700" onerror="this.style.display='none'">
                <span class="logo-font text-gray-200 text-3xl">4ggravate</span>
                <div class="absolute inset-0 bg-black opacity-0 group-hover:opacity-100 transition-opacity duration-500 flex items-center justify-center">
                    <span class="logo-font text-white text-3xl tracking-widest">4ggravate</span>
                </div>
            </a>

            <!-- 6reeze -->
            <a href="artist.html?id=6reeze" class="relative aspect-[16/10] bg-white group overflow-hidden flex items-center justify-center">
                <span class="logo-font text-gray-200 text-3xl select-none">6reeze</span>
                <div class="absolute inset-0 bg-black opacity-0 group-hover:opacity-100 transition-opacity duration-500 flex items-center justify-center">
                    <span class="logo-font text-white text-3xl tracking-widest">6reeze</span>
                </div>
            </a>

            <!-- COMING SOON -->
            <div class="aspect-[16/10] bg-white flex items-center justify-center">
                <span class="logo-font text-gray-200 text-lg italic">COMING SOON</span>
            </div>
        </section>

        <!-- LATEST NEWS -->
        <section class="max-w-6xl mx-auto px-6 py-32">
            <div class="flex justify-between items-end mb-16 border-b-2 border-black pb-8">
                <h2 class="logo-font text-5xl">LATEST NEWS</h2>
                <a href="#" class="text-[10px] font-bold tracking-[0.3em] hover:underline uppercase">VIEW ALL</a>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-16">
                <div class="group cursor-pointer">
                    <p class="text-[10px] text-gray-400 mb-4 uppercase tracking-[0.4em]">PROJECT / 202X.XX.XX</p>
                    <h3 class="text-2xl font-bold mb-6 group-hover:text-zinc-500 transition">【妄想】グループの枠を超えたスペシャルコラボユニット始動？</h3>
                    <div class="aspect-video bg-gray-50 flex items-center justify-center text-gray-200 logo-font text-3xl">COMING SOON</div>
                </div>
                <div class="group cursor-pointer">
                    <p class="text-[10px] text-gray-400 mb-4 uppercase tracking-[0.4em]">STAGE / 202X.XX.XX</p>
                    <h3 class="text-2xl font-bold mb-6 group-hover:text-zinc-500 transition">TVT所属メンバー主演舞台、チケット先行予約開始のお知らせ。</h3>
                    <div class="aspect-video bg-gray-50 flex items-center justify-center text-gray-200 logo-font text-3xl uppercase font-bold">STAGE IMAGE</div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="f-logo logo-font">TVT</div>
        <p>&copy; Teyvat Entertainment All Rights Reserved.</p>
    </footer>
</body>
</html>
