<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teyvat Entertainment | Official Site</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@400;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #fff; color: #000; font-family: 'Noto Sans JP', sans-serif; }
        .logo-font { font-family: 'Anton', sans-serif; letter-spacing: 0.1em; }
        
        /* 白ベースのグリッド */
        .visual-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px; background: #eee; border-top: 1px solid #eee; border-bottom: 1px solid #eee; }
        .grid-item { position: relative; aspect-ratio: 16/9; overflow: hidden; background: #fff; }
        .grid-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.8s; opacity: 0.9; }
        .grid-item:hover img { transform: scale(1.05); opacity: 1; }
        
        /* メインバナー（白背景・グラデーション） */
        .main-banner { position: relative; width: 100%; height: 80vh; background: #f9f9f9; overflow: hidden; }
        .banner-img { width: 100%; height: 100%; object-fit: cover; }
        .banner-overlay { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(255,255,255,1) 0%, rgba(255,255,255,0) 50%); }
        .banner-txt { position: absolute; bottom: 10%; left: 5%; color: #000; }

        @media (max-width: 768px) { .visual-grid { grid-template-columns: 1fr; } }
    </style>
</head>
