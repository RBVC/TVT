<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teyvat Entertainment | Official</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <header>
        <a href="index.html" class="logo logo-font">TVT</a>
        <nav>
            <!-- 案A: トップページのアーティスト一覧へスクロール -->
            <a href="index.html#artists" class="active">Artists</a>
            <a href="wiki.html">Wiki</a>
        </nav>
        <div class="text-[10px] font-bold text-gray-400">JP</div>
    </header>

    <main>
        <!-- Main Banner: pt-0にしてヘッダーとの隙間を完全に除去 -->
        <section class="relative w-full h-[85vh] bg-gray-50 overflow-hidden">
            <img src="images/gen1us/masquerade-gen1us.jpg" class="w-full h-full object-cover">
            <!-- グラデーションを少し濃くして文字を読みやすく -->
            <div class="absolute inset-0 bg-gradient-to-t from-white via-transparent to-transparent opacity-80"></div>
            
            <div class="absolute bottom-16 left-10 md:left-20">
                <p class="logo-font text-gray-400 text-2xl tracking-[0.3em] mb-2 uppercase">Gen1us</p>
                <!-- 文字色を完全な黒(#000)にして視認性アップ -->
                <h2 class="logo-font text-7xl md:text-[10rem] leading-[0.85] tracking-tighter text-black uppercase">Masquerade</h2>
            </div>
        </section>

        <!-- Artists Grid: ここに id="artists" を付与 -->
        <section id="artists" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-[1px] bg-gray-100 border-y border-gray-100">
            <a href="artist.html?id=gen1us" class="relative aspect-[16/10] bg-white group overflow-hidden">
                <img src="images/gen1us/masquerade-gen1us.jpg" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition duration-700">
                <div class="absolute bottom-6 left-6 logo-font text-2xl border-b border-black pb-1 uppercase">Gen1us</div>
            </a>
            <div class="aspect-[16/10] bg-gray-50 flex items-center justify-center text-gray-200 logo-font text-4xl uppercase select-none">4ggravate</div>
            <div class="aspect-[16/10] bg-white flex items-center justify-center text-gray-200 logo-font text-4xl uppercase select-none">6reeze</div>
            <div class="aspect-[16/10] bg-gray-50 flex items-center justify-center text-gray-200 logo-font text-xl uppercase select-none">Coming Soon</div>
        </section>

        <!-- LATEST NEWS -->
        <section class="max-w-6xl mx-auto px-6 py-32">
            <div class="flex justify-between items-end mb-16 border-b-2 border-black pb-8">
                <h2 class="logo-font text-5xl uppercase italic">Latest News</h2>
                <a href="#" class="text-[10px] font-bold tracking-[0.3em] hover:underline uppercase">View All</a>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-16">
                <!-- ここを将来的に special.html?id=masquerade-interview 等に飛ばす -->
                <div class="group cursor-pointer">
                    <p class="text-[10px] text-gray-400 mb-4 uppercase tracking-[0.4em]">Project / 202X.XX.XX</p>
                    <h3 class="text-2xl font-bold mb-6 group-hover:text-zinc-500 transition">【妄想】グループの枠を超えたスペシャルコラボユニット始動？</h3>
                    <div class="aspect-video bg-gray-50 flex items-center justify-center text-gray-200 logo-font text-3xl">COMING SOON</div>
                </div>
                <div class="group cursor-pointer">
                    <p class="text-[10px] text-gray-400 mb-4 uppercase tracking-[0.4em]">Stage / 202X.XX.XX</p>
                    <h3 class="text-2xl font-bold mb-6 group-hover:text-zinc-500 transition">TVT所属メンバー主演舞台、チケット先行予約開始のお知らせ。</h3>
                    <div class="aspect-video bg-gray-50 flex items-center justify-center text-gray-200 logo-font text-3xl">STAGE IMAGE</div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="f-logo logo-font">TVT</div>
        <p>&copy; Teyvat Entertainment All Rights Reserved.</p>
    </footer>
</body>
</html>
