<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teyvat Entertainment | Official</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 🆕 フルワイド・グリッド：画面の端まで隙間なく配置 */
        .yg-full-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr; /* 左右比率を不均等にしてモダンに */
            gap: 2px;
            width: 100vw; /* 画面幅いっぱい */
            margin-left: calc(50% - 50vw); /* 親要素の幅を超えて全画面化 */
        }
        
        .yg-item {
            position: relative;
            overflow: hidden;
            background-color: #000;
        }

        /* 迫力を出すための高さ設定（スクショ5枚目を意識） */
        .height-main { height: 60vh; }
        .height-sub { height: 45vh; }

        .yg-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 1.2s cubic-bezier(0.2, 1, 0.3, 1);
            filter: brightness(0.95);
        }

        .yg-item:hover img {
            transform: scale(1.05);
            filter: brightness(1.1);
        }

        /* ホバー時のテキスト演出 */
        .yg-overlay {
            position: absolute;
            inset: 0;
            background-color: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .yg-item:hover .yg-overlay {
            opacity: 1;
        }

        /* スマホ対応：1列に縦積み */
        @media (max-width: 768px) {
            .yg-full-grid {
                grid-template-columns: 1fr;
            }
            .height-main, .height-sub {
                height: 50vh;
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">TVT</a>
        <div class="menu-trigger" id="menu-btn">
            <span></span><span></span><span></span>
        </div>
    </header>

    <div class="nav-overlay" id="nav-menu">
        <a href="index.html#artists" class="menu-close">ARTISTS</a>
        <a href="wiki.html" class="menu-close">WIKI</a>
    </div>

    <main class="pt-[73px]">
        
        <!-- 🆕 フルワイド・ビジュアル・グリッド -->
        <section id="artists" class="yg-full-grid">
            
            <!-- 1. GEN1US -->
            <a href="artist.html?id=gen1us" class="yg-item height-main">
                <img src="images/gen1us/masquerade-gen1us.jpg" alt="GEN1US">
                <div class="yg-overlay">
                    <span class="logo-font text-white text-5xl tracking-widest">GEN1US</span>
                </div>
            </a>

            <!-- 2. 4ggravate -->
            <a href="artist.html?id=4ggravate" class="yg-item height-main">
                <img src="images/4ggravate/4ggravate.jpg" alt="4ggravate" style="object-position: center 20%;">
                <div class="yg-overlay">
                    <span class="logo-font text-white text-5xl tracking-widest">4ggravate</span>
                </div>
            </a>

            <!-- 3. 6reeze -->
            <a href="artist.html?id=6reeze" class="yg-item height-sub">
                <img src="images/6reeze/6reeze.jpg" alt="6reeze">
                <div class="yg-overlay">
                    <span class="logo-font text-white text-5xl tracking-widest">6reeze</span>
                </div>
            </a>

            <!-- 4. TVT U -->
            <a href="artist.html?id=universe" class="yg-item height-sub">
                <img src="images/universe/tvt-u.jpg" alt="TVT U">
                <div class="yg-overlay">
                    <span class="logo-font text-white text-5xl tracking-widest">TVT U</span>
                </div>
            </a>

        </section>

        <!-- LATEST NEWS: ここは中央寄せのまま品格を保つ -->
        <section class="max-w-6xl mx-auto px-6 py-24">
            <div class="flex justify-between items-end mb-16 border-b-2 border-black pb-8">
                <h2 class="logo-font text-5xl uppercase">Latest News</h2>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-16">
                <div class="group cursor-pointer">
                    <p class="text-[10px] text-gray-400 mb-4 uppercase tracking-[0.4em]">Project / 202X.XX.XX</p>
                    <h3 class="text-2xl font-bold mb-6">【妄想】スペシャルコラボユニット始動？</h3>
                    <div class="aspect-video bg-gray-50 flex items-center justify-center text-gray-200 logo-font text-3xl uppercase">Coming Soon</div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="f-logo">TVT</div>
        <p>&copy; Teyvat Entertainment All Rights Reserved.</p>
    </footer>

    <script>
        const menuBtn = document.getElementById('menu-btn');
        const navMenu = document.getElementById('nav-menu');
        const menuLinks = document.querySelectorAll('.menu-close');

        menuBtn.onclick = () => {
            menuBtn.classList.toggle('active');
            navMenu.classList.toggle('open');
            document.body.style.overflow = navMenu.classList.contains('open') ? 'hidden' : 'auto';
        };
        menuLinks.forEach(link => {
            link.onclick = () => {
                menuBtn.classList.remove('active');
                navMenu.classList.remove('open');
                document.body.style.overflow = 'auto';
            };
        });
    </script>
</body>
</html>
