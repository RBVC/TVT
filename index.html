<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teyvat Entertainment | Official</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="group.js"></script>
    <script src="common.js"></script>
    <style>
        .main-visual-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px; width: 100vw; margin-left: calc(50% - 50vw); background-color: #fff; }
        .artist-box { position: relative; width: 100%; aspect-ratio: 3 / 1; overflow: hidden; background-color: #000; }
        .artist-box img { width: 100%; height: 100%; object-fit: contain; display: block; transition: transform 1.2s cubic-bezier(0.2, 1, 0.3, 1); }
        .artist-box:hover img { transform: scale(1.05); }
        .artist-hover { position: absolute; inset: 0; background-color: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.5s ease; z-index: 10; }
        .artist-box:hover .artist-hover { opacity: 1; }
        @media (max-width: 768px) { .main-visual-grid { grid-template-columns: 1fr; } .artist-box { aspect-ratio: 3 / 1; } }
    </style>
</head>
<body>
    <div id="common-header"></div>

    <main class="pt-[73px]">
        <section id="artists" class="main-visual-grid">
            <a href="artist.html?id=gen1us" class="artist-box"><img src="images/gen1us/masquerade-gen1us.jpg" alt="GEN1US"><div class="artist-hover"><span class="logo-font text-white text-4xl md:text-6xl tracking-widest">GEN1US</span></div></a>
            <a href="artist.html?id=4ggravate" class="artist-box"><img src="images/4ggravate/4ggravate.jpg" alt="4ggravate"><div class="artist-hover"><span class="logo-font text-white text-4xl md:text-6xl tracking-widest">4ggravate</span></div></a>
            <a href="artist.html?id=6reeze" class="artist-box"><img src="images/6reeze/6reeze.jpg" alt="6reeze"><div class="artist-hover"><span class="logo-font text-white text-4xl md:text-6xl tracking-widest">6reeze</span></div></a>
            <a href="artist.html?id=universe" class="artist-box"><img src="images/universe/tvt-u.jpg" alt="TVT U"><div class="artist-hover"><span class="logo-font text-white text-4xl md:text-6xl tracking-widest">TVT U</span></div></a>
        </section>

        <!-- LATEST NEWS: 最新が左、過去が右 -->
        <section class="max-w-6xl mx-auto px-6 py-24">
            <h2 class="logo-font text-5xl uppercase border-b-2 border-black pb-8 mb-16">Latest News</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-16">
                
                <!-- 🆕 PROJECT: THE SOVEREIGN (左側：最新) -->
                <a href="news.html?id=the-sovereign" class="group cursor-pointer block">
                    <p class="text-[10px] text-gray-400 mb-4 uppercase tracking-[0.4em]">Project / Teyvat Times</p>
                    <h3 class="text-2xl font-bold mb-6 group-hover:text-gray-500 transition uppercase">Special Project『THE SOVEREIGN』始動。全16名の配役解禁。</h3>
                    <div class="aspect-video bg-gray-100 overflow-hidden border border-gray-100">
                        <img src="images/the-sovereign/main.jpg" class="w-full h-full object-cover transition duration-700 group-hover:scale-105" alt="THE SOVEREIGN">
                    </div>
                </a>

                <!-- PROJECT: Nightfall Ops (右側：過去) -->
                <a href="news.html?id=nightfall-ops" class="group cursor-pointer block">
                    <p class="text-[10px] text-gray-400 mb-4 uppercase tracking-[0.4em]">Project / Archive</p>
                    <h3 class="text-2xl font-bold mb-6 group-hover:text-gray-500 transition uppercase">特殊作戦『Nightfall Ops』記録公開。4人の隠密任務。</h3>
                    <div class="aspect-video bg-gray-100 overflow-hidden border border-gray-100">
                        <img src="images/nightfall-ops/main.jpg" class="w-full h-full object-cover transition duration-700 group-hover:scale-105" alt="Nightfall Ops">
                    </div>
                </a>

            </div>
        </section>
    </main>
    <div id="common-footer"></div>
</body>
</html>
