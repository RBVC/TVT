<!-- --- START OF FILE index.html --- -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teyvat Entertainment | Official</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="data/wiki.js"></script>
    <script src="data/group/gen1us.js"></script>
    <script src="data/group/4ggravate.js"></script>
    <script src="data/group/6reeze.js"></script>
    <script src="data/group/universe.js"></script>
    <script src="data/group/house-of-the-hearth.js"></script>
    <script src="data/project/heaventeen.js"></script>
    <script src="data/project/nightfall-ops.js"></script>
    <script src="data/project/the-sovereign.js"></script>
    <script src="common.js"></script>

    <style>
        .main-visual-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px; width: 100vw; margin-left: calc(50% - 50vw); background-color: #fff; }
        .artist-box { position: relative; width: 100%; aspect-ratio: 3 / 1; overflow: hidden; background-color: #000; }
        .artist-box img { width: 100%; height: 100%; object-fit: cover; transition: 1.2s; }
        .artist-box:hover img { transform: scale(1.05); }
        /* 🆕 ホバー文字デザイン修正：小さく、太く */
        .artist-hover { position: absolute; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.5s; z-index: 10; }
        .artist-box:hover .artist-hover { opacity: 1; }
        .artist-name-hover { font-weight: 900; font-size: 1.5rem; letter-spacing: 0.3em; color: #fff; text-transform: uppercase; }
        @media (max-width: 768px) { .main-visual-grid { grid-template-columns: 1fr; } .artist-name-hover { font-size: 1.2rem; } }
    </style>
</head>
<body>
    <div id="common-header"></div>
    <main>
        <!-- 💡 修正：余白を mt-6 mb-8 まで圧縮 -->
        <div class="flex justify-center space-x-12 mt-6 mb-8 border-b border-gray-100 max-w-6xl mx-auto">
            <button onclick="switchMainTab('artists')" id="btn-artists" class="tab-btn active">Artists</button>
            <button onclick="switchMainTab('news')" id="btn-news" class="tab-btn">Latest News</button>
        </div>

        <div id="tab-artists" class="tab-content block">
            <section class="main-visual-grid">
                <script>
                    document.write(Object.keys(allGroups).map(id => {
                        const g = allGroups[id];
                        if (!g.banner) return '';
                        return `<a href="artist.html?id=${id}" class="artist-box"><img src="${g.basePath + g.banner}"><div class="artist-hover"><span class="artist-name-hover logo-font">${g.name}</span></div></a>`;
                    }).join(''));
                </script>
            </section>
        </div>

        <div id="tab-news" class="tab-content hidden">
            <section class="max-w-6xl mx-auto px-6 py-8">
                <div id="latest-news-list" class="grid grid-cols-1 md:grid-cols-2 gap-16"></div>
            </section>
        </div>
    </main>
    <div id="common-footer"></div>

    <script>
        function switchMainTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(c => { c.classList.add('hidden'); c.classList.remove('block'); });
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            const targetContent = document.getElementById('tab-' + tabName);
            const targetBtn = document.getElementById('btn-' + tabName);
            if (targetContent && targetBtn) {
                targetContent.classList.remove('hidden');
                targetContent.classList.add('block');
                targetBtn.classList.add('active');
            }
        }
        window.addEventListener('load', () => {
            const params = new URLSearchParams(window.location.search);
            const tab = params.get('tab');
            if (tab) switchMainTab(tab);
        });
    </script>
</body>
</html>
