<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teyvat Entertainment | Official</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #fff; color: #000; font-family: 'Noto Sans JP', sans-serif; }
        .logo-font { font-family: 'Anton', sans-serif; letter-spacing: 0.05em; font-style: normal; }
        
        /* メインバナーの文字を浮かび上がらせる魔法 */
        .text-shadow-premium {
            /* 非常に薄い白の光を文字の背後に置いて、可読性を劇的に上げます */
            text-shadow: 0 0 20px rgba(255,255,255,0.8), 0 0 10px rgba(255,255,255,0.5);
        }

        .visual-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px; background: #eee; }
        .grid-item { position: relative; aspect-ratio: 16/9; overflow: hidden; background: #fff; }
        .grid-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.8s; opacity: 0.9; }
        .grid-item:hover img { transform: scale(1.05); opacity: 1; }

        @media (max-width: 768px) { .visual-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo logo-font">TVT</a>
        <nav>
            <a href="index.html#artists" class="active">Artists</a>
            <a href="wiki.html">Wiki</a>
        </nav>
        <div class="text-[10px] font-bold text-gray-400 uppercase">JP</div>
    </header>

    <main class="pt-0">
        <!-- Main Banner -->
        <section class="relative w-full h-[85vh] bg-white overflow-hidden">
            <!-- 画像自体を少しだけ明るくして、白背景に馴染ませる -->
            <img src="images/gen1us/masquerade-gen1us.jpg" class="w-full h-full object-cover opacity-90">
            
            <!-- 【重要】白のレイヤー（グラデーション） -->
            <!-- 下から上に向かって白→透明になるレイヤーを重ねます -->
            <div class="absolute inset-0 bg-gradient-to-t from-white via-white/40 to-transparent"></div>
            
            <!-- テキストエリア -->
            <div class="absolute bottom-20 left-10 md:left-20 z-10">
                <p class="logo-font text-gray-500 text-2xl tracking-[0.4em] mb-4 uppercase text-shadow-premium">Gen1us</p>
                <!-- 大文字・斜めなし・圧倒的な存在感 -->
                <h2 class="logo-font text-7xl md:text-[11rem] leading-[0.8] tracking-tighter text-black uppercase text-shadow-premium">
                    Masquerade
                </h2>
            </div>
        </section>

        <!-- Artists Grid -->
        <section id="artists" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-[1px] bg-gray-100 border-y border-gray-100">
            <a href="artist.html?id=gen1us" class="relative aspect-[16/10] bg-white group overflow-hidden">
                <img src="images/gen1us/masquerade-gen1us.jpg" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition duration-700">
                <div class="absolute bottom-6 left-6 logo-font text-2xl border-b-2 border-black pb-1 uppercase">Gen1us</div>
            </a>
            <div class="aspect-[16/10] bg-gray-50 flex items-center justify-center text-gray-200 logo-font text-4xl uppercase select-none">4ggravate</div>
            <div class="aspect-[16/10] bg-white flex items-center justify-center text-gray-200 logo-font text-4xl uppercase select-none">6reeze</div>
            <div class="aspect-[16/10] bg-gray-50 flex items-center justify-center text-gray-200 logo-font text-xl uppercase select-none">Coming Soon</div>
        </section>

        <!-- LATEST NEWS -->
        <section class="max-w-6xl mx-auto px-6 py-32">
            <div class="flex justify-between items-end mb-16 border-b-2 border-black pb-8">
                <h2 class="logo-font text-5xl uppercase">Latest News</h2>
                <a href="#" class="text-[10px] font-bold tracking-[0.3em] hover:underline uppercase">View All</a>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-16">
                <div class="group cursor-pointer">
                    <p class="text-[10px] text-gray-400 mb-4 uppercase tracking-[0.4em]">Project / 202X.XX.XX</p>
                    <h3 class="text-2xl font-bold mb-6 group-hover:text-gray-500 transition">【妄想】グループの枠を超えたスペシャルコラボユニット始動？</h3>
                    <div class="aspect-video bg-gray-50 flex items-center justify-center text-gray-200 logo-font text-3xl uppercase">Coming Soon</div>
                </div>
                <div class="group cursor-pointer">
                    <p class="text-[10px] text-gray-400 mb-4 uppercase tracking-[0.4em]">Stage / 202X.XX.XX</p>
                    <h3 class="text-2xl font-bold mb-6 group-hover:text-gray-500 transition">TVT所属メンバー主演舞台、チケット先行予約開始のお知らせ。</h3>
                    <div class="aspect-video bg-gray-50 flex items-center justify-center text-gray-200 logo-font text-3xl uppercase">Stage Image</div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="f-logo logo-font">TVT</div>
        <p>&copy; Teyvat Entertainment All Rights Reserved.</p>
    </footer>
</body>
</html>
