<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <script src="group.js"></script>
    <script src="project.js"></script>
    <style>
        /* モーダル内コンテンツ専用調整 */
        body { background: #000; color: #fff; padding: 0; margin: 0; overflow-y: auto; }
        
        .cast-layout { 
            display: flex; 
            min-height: 100vh; 
            align-items: center; 
            padding: 60px; /* 💡❌ボタンを避けるためにパディングを増量 */
            gap: 40px; 
        }
        .cast-img { width: 40%; aspect-ratio: 1/1; object-fit: cover; border: 1px solid #333; flex-shrink: 0; }
        .cast-info { flex: 1; text-align: left; }
        .cast-role { font-size: 1rem; color: #fff; background: #333; padding: 4px 15px; display: inline-block; margin-bottom: 20px; font-weight: 700; border: 1px solid #444; }
        .cast-name { font-size: 3.5rem; font-weight: 900; margin-bottom: 20px; line-height: 1; }
        .cast-desc { font-size: 1rem; color: #ccc; line-height: 1.8; margin-bottom: 30px; max-width: 500px; }
        .cast-pos { font-size: 0.8rem; color: #666; font-weight: 800; border-top: 1px solid #222; padding-top: 15px; letter-spacing: 0.1em; }

        @media (max-width: 768px) {
            .cast-layout { flex-direction: column; padding: 40px 20px; align-items: flex-start; }
            .cast-img { width: 100%; max-width: 300px; margin: 0 auto; }
            .cast-name { font-size: 2.2rem; }
            .cast-desc { font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div id="cast-detail" class="cast-layout"></div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const pid = params.get('pid');
        const tidx = params.get('tidx');
        const midx = params.get('midx');
        const m = specialProjects[pid].teams[tidx].members[midx];

        document.getElementById('cast-detail').innerHTML = `
            <img src="${m.img}" class="cast-img" onerror="this.src='https://placehold.jp/400x400.png?text=${m.name}'">
            <div class="cast-info">
                <div class="cast-role">${m.role}</div>
                <h2 class="cast-name logo-font">${m.name}</h2>
                <p class="cast-desc">${m.desc}</p>
                ${m.pos ? `<p class="cast-pos uppercase">${m.pos}</p>` : ''}
            </div>
        `;
    </script>
</body>
</html>
